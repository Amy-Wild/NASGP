<div style="font-family: 'Inter', system-ui, sans-serif; color: #0B1F33; background: #FFFFFF; font-size: 17px; line-height: 1.55">

  <div style="background: #0B1F33; color: #FFFFFF; font-size: 14px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center">
      <span>The independent membership body for sessional GPs, since 1997</span>
      <div style="display: flex; flex-wrap: wrap; gap: 20px">
        <a href="#" style="color: #FFFFFF; text-decoration: none">Practices: sign in or register</a>
        <a href="#" style="color: #FFFFFF; text-decoration: none; font-weight: 700">Go to LocumDeck</a>
      </div>
    </div>
  </div>
  <header style="border-bottom: 1px solid #DCE6D6; background: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; text-decoration: none" aria-label="NASGP home">
        <span style="background: #4FA83D; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1; padding: 10px 16px 12px">nasgp</span>
        <span style="background: #0B1F33; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-size: 13px; line-height: 1.15; padding: 8px 12px; display: flex; align-items: center; max-width: 150px">National Association of Sessional GPs</span>
      </a>
      <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; font-weight: 500; font-size: 16px">
        <a href="gps.html" style="color: #0B1F33; text-decoration: none">For GPs</a>
        <a href="practices.html" style="color: #0B1F33; text-decoration: none">For practices</a>
        <a href="icbs.html" style="color: #0B1F33; text-decoration: none">For ICBs and PCNs</a>
        <a href="partnerships.html" style="color: #0B1F33; text-decoration: none">Partnerships</a>
        <a href="locumdeck.html" style="color: #0B1F33; text-decoration: none">LocumDeck</a>
        <a href="news.html" style="color: #0B1F33; text-decoration: none">News and guides</a>
        <a href="about.html" style="color: #0B1F33; text-decoration: none">About</a>
        <a href="join.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: 600">Join free</a>
      </nav>
    </div>
  </header>

  <section style="max-width: 1240px; margin: 0 auto; padding: 80px 24px 96px; display: flex; flex-wrap: wrap; gap: 48px 72px">
    <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
      <div>
        <h1 style="margin: 0; font-weight: 800; font-size: 56px; line-height: 1.05; letter-spacing: -0.025em"><span style="position: relative; display: inline-block; white-space: nowrap">Talk to us<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span></h1>
        <p style="margin: 14px 0 0; font-size: 19px; color: #3A4F6B">Real people, Monday to Friday, 9am to 5pm. Pick the team that fits and you'll get the right answer faster.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="background: #E2F2DA; border-radius: 12px; padding: 20px 22px"><strong>GP members and membership</strong><p style="margin: 4px 0 0; font-size: 15px; color: #2A4566">Joining, plans, billing, LocumDeck help</p></div>
        <div style="background: #FCE3DA; border-radius: 12px; padding: 20px 22px"><strong>Practices and ambassadors</strong><p style="margin: 4px 0 0; font-size: 15px; color: #2A4566">Booking cover, practice accounts, ambassador scheme</p></div>
        <div style="background: #EDE6F5; border-radius: 12px; padding: 20px 22px"><strong>ICB and PCN partnerships</strong><p style="margin: 4px 0 0; font-size: 15px; color: #2A4566">Funded access, workforce data, procurement</p></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 16px">
        <span><strong>Phone</strong> 0161 504 8999</span>
        <span><strong>Email</strong> info@nasgp.org.uk</span>
        <span><strong>Post</strong> Amelia House, Crescent Road, Worthing, BN11 1QR</span>
      </div>
    </div>
    <form style="flex: 1 1 520px; min-width: 0; background: #EEF6E8; border-radius: 14px; padding: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; align-content: start">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="c-name" style="font-weight: 600; font-size: 15px">Name</label><input id="c-name" type="text" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="c-email" style="font-weight: 600; font-size: 15px">Email</label><input id="c-email" type="email" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF"></div>
      <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px"><label for="c-team" style="font-weight: 600; font-size: 15px">What's it about?</label><select id="c-team" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF"><option>My GP membership</option><option>Booking cover for a practice</option><option>The ambassador scheme</option><option>An ICB or PCN partnership</option><option>Press or something else</option></select></div>
      <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px"><label for="c-msg" style="font-weight: 600; font-size: 15px">Message</label><textarea id="c-msg" rows="6" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF; resize: vertical"></textarea></div>
      <button type="button" style="justify-self: start; font: inherit; font-weight: 700; background: #0B1F33; color: #FFFFFF; border: 0; padding: 16px 26px; border-radius: 6px; cursor: pointer">Send message</button>
      <p style="grid-column: 1 / -1; margin: 0; font-size: 14px; color: #56687F">We'll use your details only to reply. See our <a href="#">privacy policy</a>.</p>
    </form>
  </section>

  <footer style="background: #0B1F33; color: #D6DEE8; font-size: 15px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; color: #FFFFFF">nasgp</span>
      <span style="display: flex; flex-wrap: wrap; gap: 8px 24px"><a href="about.html" style="color: #D6DEE8">About</a><a href="help.html" style="color: #D6DEE8">Help</a><span>© 2026 NASGP</span></span>
    </div>
  </footer>
</div>
