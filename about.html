  <section style="background: #EEF6E8">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; gap: 40px 72px; align-items: end">
      <div style="flex: 1 1 640px; min-width: 0">
        <p style="margin: 0 0 16px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #2F6B22">About NASGP</p>
        <h1 style="margin: 0; font-weight: 800; font-size: 62px; line-height: 1.03; letter-spacing: -0.025em">Built by and for sessional GPs. <span style="position: relative; display: inline-block; white-space: nowrap">Thirty years<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span> of independence and advocacy.</h1>
      </div>
      <p style="flex: 1 1 380px; min-width: 0; margin: 0; font-size: 20px; color: #3A4F6B">NASGP is the independent membership body for sessional GPs. Not an agency, not a recruitment firm, not owned by any commercial interest. It was founded by sessional GPs, run for sessional GPs, and has been fighting their corner since 1997.</p>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; gap: 48px 72px">
    <div style="flex: 1 1 420px; min-width: 0">
      <h2 style="margin: 0 0 20px; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em">Our story</h2>
      <p style="margin: 0 0 18px; color: #3A4F6B">Dr Richard Fieldhouse and Dr Sara Chambers founded NASGP in 1997, when sessional GPs had no voice and very little support. [One or two sentences on why they started it.]</p>
      <p style="margin: 0; color: #3A4F6B">That became LocumDeck: a platform designed by GP locums, so GPs can work as independent professionals on their own terms rather than as a commodity.</p>
    </div>
    <div style="flex: 1 1 520px; min-width: 0">
      <template data-kind="for" list="{{timeline}}" as="t" hint-placeholder-count="6">
        <div style="display: flex; gap: 24px; padding: 18px 0; border-top: 1px solid #DCE6D6">
          <strong style="flex: 0 0 72px; font-size: 22px; font-weight: 800">{{t.year}}</strong>
          <span style="color: #3A4F6B">{{t.text}}</span>
        </div>

    </div>
  </section>

  <section style="background: #0B1F33; color: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px">
      <h2 style="margin: 0 0 40px; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em">What we believe</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px">
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Sessional GPs are the workforce</h3><p style="margin: 0; color: #D6DEE8">Not gap-fillers. A planned, valued part of general practice.</p></div>
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Direct beats middlemen</h3><p style="margin: 0; color: #D6DEE8">GPs and practices should work together without margins taken in between.</p></div>
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Nobody should go it alone</h3><p style="margin: 0; color: #D6DEE8">Peer support, chambers and good advice make flexible work sustainable.</p></div>
      </div>
    </div>
  </section>

  <!-- NHS Pension win: headline credibility -->
  <section style="background: #EEF6E8">
    <div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
      <p style="margin: 0 0 12px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #2F6B22">What 30 years of advocacy looks like</p>
      <h2 style="margin: 0 0 48px; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; max-width: 760px">NASGP wins for members. This is the most important one.</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px">
        <div style="background: #FFFFFF; border-radius: 14px; padding: 40px">
          <p style="margin: 0 0 8px; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #2F6B22">Landmark win</p>
          <h3 style="margin: 0 0 16px; font-size: 26px; font-weight: 700; line-height: 1.2">NHS Pension access for GP locums</h3>
          <p style="margin: 0; color: #33475B; font-size: 18px; line-height: 1.55">For years, GP locums were excluded from the NHS Pension Scheme in a way that salaried colleagues were not. NASGP campaigned consistently for years to change that. It did. GP locums can now access the NHS Pension on fair terms. This is the credibility no agency or booking platform can copy: tangible, sustained advocacy that changed the law.</p>
          <p style="margin: 16px 0 0; color: #33475B">LocumDeck automates the Locum A and B forms so the pension entitlement is claimed without extra admin after every booked session.</p>
          <a href="campaigns.html" style="display: inline-block; margin-top: 20px; font-weight: 600">See campaigns and wins</a>
        </div>
        <div style="border: 1px solid #DCE6D6; border-radius: 14px; padding: 40px">
          <p style="margin: 0 0 8px; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #1E4A70">Ongoing</p>
          <h3 style="margin: 0 0 16px; font-size: 26px; font-weight: 700; line-height: 1.2">Fair rates, workforce recognition and sessional GP visibility</h3>
          <p style="margin: 0; color: #33475B; font-size: 18px; line-height: 1.55">Sessional GPs are often invisible to NHS planners. NASGP uses the anonymised dataset behind LocumDeck to make them visible and ensure their interests are represented in national consultations, workforce planning and policy decisions.</p>
        </div>
      </div>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <h2 style="margin: 0 0 40px; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em">The team</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px">

          <strong style="font-size: 18px">{{p.name}}</strong>

      <a href="contact.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 16px 24px; border-radius: 6px; font-weight: 600">Get in touch</a>

    </div>
