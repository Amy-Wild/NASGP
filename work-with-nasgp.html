<div style="font-family: 'Inter', system-ui, sans-serif; color: #0B1F33; background: #FFFFFF; font-size: 17px; line-height: 1.55">

  <div style="background: #0B1F33; color: #FFFFFF; font-size: 14px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center">
      <span>The independent membership body for sessional GPs, since 1997</span>
      <div style="display: flex; flex-wrap: wrap; gap: 20px">
        <a href="#" style="color: #FFFFFF; text-decoration: none">Practices: sign in or register</a>
        <a href="#" style="color: #FFFFFF; text-decoration: none; font-weight: 700">Go to LocumDeck</a>
      </div>
    </div>

  <header style="border-bottom: 1px solid #DCE6D6; background: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; text-decoration: none" aria-label="NASGP home">
        <span style="background: #4FA83D; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1; padding: 10px 16px 12px">nasgp</span>
        <span style="background: #0B1F33; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-size: 13px; line-height: 1.15; padding: 8px 12px; display: flex; align-items: center; max-width: 150px">National Association of Sessional GPs</span>
      </a>
      <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; font-weight: 500; font-size: 16px">
        <a href="gps.html" style="color: #0B1F33; text-decoration: none">For GPs</a>
        <a href="practices.html" style="color: #0B1F33; text-decoration: none">For practices</a>
        <a href="icbs.html" style="color: #0B1F33; text-decoration: none">For ICBs and PCNs</a>
        <a href="work-with-nasgp.html" style="color: #0B1F33; text-decoration: underline; text-decoration-color: #4FA83D; text-decoration-thickness: 3px; text-underline-offset: 8px">Work with NASGP</a>
        <a href="about.html" style="color: #0B1F33; text-decoration: none">About</a>
        <a href="contact.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: 600">Talk to us</a>
      </nav>
    </div>
    <nav aria-label="Member resources" style="border-top: 1px solid #DCE6D6; background: #FAFBF9">
      <div style="max-width: 1240px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; gap: 0 20px; font-size: 14px; font-weight: 500">
        <a href="community.html" style="color: #33475B; text-decoration: none; padding: 4px 0">Community</a>
        <a href="academy.html" style="color: #33475B; text-decoration: none; padding: 4px 8px">Academy</a>
        <a href="campaigns.html" style="color: #33475B; text-decoration: none; padding: 4px 8px">Campaigns</a>
        <a href="chambers.html" style="color: #33475B; text-decoration: none; padding: 4px 8px">Chambers</a>
        <a href="resource-hub.html" style="color: #33475B; text-decoration: none; padding: 4px 8px">Resources</a>
        <a href="locumdeck.html" style="color: #33475B; text-decoration: none; padding: 4px 8px">LocumDeck</a>
        <a href="news.html" style="color: #33475B; text-decoration: none; padding: 4px 8px">News and guides</a>
      </div>
    </nav>
  </header>

  <!-- Hero -->
  <section style="background: #EEF6E8">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px 72px">
      <p style="margin: 0 0 16px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #2F6B22">Work with NASGP</p>
      <h1 style="margin: 0; font-weight: 800; font-size: 60px; line-height: 1.04; letter-spacing: -0.025em; max-width: 920px">Working strategically with the <span style="position: relative; display: inline-block; white-space: nowrap">NHS and beyond.<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span></h1>
      <p style="margin: 24px 0 0; font-size: 20px; max-width: 700px; color: #3A4F6B">NASGP works with NHS commissioners and system partners to build flexible GP workforce capacity. We also support independent providers delivering NHS services who need experienced GPs.</p>
      <div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; max-width: 900px">
        <a href="#nhs-commissioners" style="display: flex; flex-direction: column; gap: 12px; background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 28px 32px; border-radius: 14px">
          <p style="margin: 0; font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #F2765A">Door one</p>
          <h2 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.2">NHS commissioners and system partners</h2>
          <p style="margin: 0; color: #D6DEE8; font-size: 16px">ICBs, PCNs, LMCs, training hubs, medical defence organisations and national bodies</p>
          <span style="margin-top: 8px; font-weight: 600; color: #FFFFFF">Explore ↓</span>
        </a>
        <a href="#independent-providers" style="display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; color: #0B1F33; text-decoration: none; padding: 28px 32px; border-radius: 14px; border: 2px solid #0B1F33">
          <p style="margin: 0; font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #1E4A70">Door two</p>
          <h2 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.2">Independent providers</h2>
          <p style="margin: 0; color: #3A4F6B; font-size: 16px">Organisations delivering NHS services who need experienced sessional GPs</p>
          <span style="margin-top: 8px; font-weight: 600">Explore ↓</span>
        </a>
      </div>
    </div>
  </section>

  <!-- Thames Valley proof block -->
  <section style="background: #FFFFFF; border-bottom: 1px solid #DCE6D6">
    <div style="max-width: 1240px; margin: 0 auto; padding: 56px 24px">
      <p style="margin: 0 0 8px; font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #56687F">[PLACEHOLDER  confirm figures with Kyle]</p>
      <p style="margin: 0 0 32px; color: #56687F; font-size: 15px">Thames Valley results  four headline figures, including money saved</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0; border-top: 2px solid #0B1F33">
        <div style="padding: 24px 24px 0 0">
          <div style="font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -0.03em; color: #56687F">[X]%</div>
          <p style="margin: 8px 0 0; color: #3A4F6B">increase in GP sessions filled directly</p>
        </div>
        <div style="padding: 24px 24px 0 0">
          <div style="font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -0.03em; color: #56687F">[X]%</div>
          <p style="margin: 8px 0 0; color: #3A4F6B">reduction in agency spend</p>
        </div>
        <div style="padding: 24px 24px 0 0">
          <div style="font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -0.03em; color: #56687F">£[X]m</div>
          <p style="margin: 8px 0 0; color: #3A4F6B">saved across the system</p>
        </div>
        <div style="padding: 24px 24px 0 0">
          <div style="font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -0.03em; color: #56687F">[X]+</div>
          <p style="margin: 8px 0 0; color: #3A4F6B">practices using LocumDeck in the area</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Door 1: NHS commissioners -->
  <section id="nhs-commissioners" style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <div style="display: flex; flex-wrap: wrap; gap: 40px 64px; align-items: start">
      <div style="flex: 1 1 460px; min-width: 0">
        <p style="margin: 0 0 12px; font-weight: 700; font-size: 15px; color: #2F6B22">NHS commissioners and system partners</p>
        <h2 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1.08; letter-spacing: -0.02em">Your sessional GPs are already there. Make them part of the plan.</h2>
        <p style="margin: 18px 0 0; color: #3A4F6B; font-size: 19px">ICBs, PCNs, LMCs, training hubs, the Royal College, medical defence organisations and other national or regional bodies. NASGP is the infrastructure behind a visible, well-supported sessional GP workforce in your area.</p>
        <div style="margin-top: 24px">
          <a href="icbs.html" style="display: inline-block; background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 16px 24px; border-radius: 6px; font-weight: 600">See ICB and PCN partnerships</a>
        </div>
      </div>
      <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <div style="background: #E2F2DA; border-radius: 14px; padding: 22px 24px">
          <strong>Build a visible, flexible workforce</strong>
          <p style="margin: 4px 0 0; color: #2A4566; font-size: 16px">Fund GP membership locally and sessional GPs in your footprint are on LocumDeck, visible and bookable by your practices.</p>
        </div>
        <div style="background: #DDEAF4; border-radius: 14px; padding: 22px 24px">
          <strong>Workforce data and intelligence</strong>
          <p style="margin: 4px 0 0; color: #2A4566; font-size: 16px">Sessions, hours, capacity and rates across your area. All data is anonymised and no member's personal data is shared.</p>
        </div>
        <div style="background: #FCE3DA; border-radius: 14px; padding: 22px 24px">
          <strong>Supporting the neighbourhood health model</strong>
          <p style="margin: 4px 0 0; color: #2A4566; font-size: 16px">Sessional GPs who work across multiple practices are well placed for neighbourhood health. NASGP helps them stay, stay well and stay local.</p>
        </div>
        <div style="background: #EDE6F5; border-radius: 14px; padding: 22px 24px">
          <strong>An umbrella of quality</strong>
          <p style="margin: 4px 0 0; color: #2A4566; font-size: 16px">NASGP advises, supports and retains GPs. It looks after the workforce rather than commodifying it.</p>
        </div>
      </div>
    </div>
    <div style="margin-top: 40px; border: 1px solid #DCE6D6; border-radius: 14px; padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: center; justify-content: space-between">
      <p style="margin: 0; max-width: 760px">LocumDeck is listed on G-Cloud as a registered NHS digital supplier. Procurement through the framework is straightforward.</p>
      <a href="contact.html" style="font-weight: 600; text-decoration: none; color: #0B1F33">Book a partnership call</a>
    </div>
  </section>

  <!-- Door 2: Independent providers -->
  <section id="independent-providers" style="background: #0B1F33; color: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
      <p style="margin: 0 0 12px; font-weight: 700; font-size: 15px; color: #F2765A">Independent providers</p>
      <h2 style="margin: 0 0 16px; font-weight: 800; font-size: 44px; line-height: 1.08; letter-spacing: -0.02em; max-width: 820px">Delivering NHS services and need experienced sessional GPs?</h2>
      <p style="margin: 0 0 40px; color: #D6DEE8; font-size: 19px; max-width: 720px">Independent providers delivering extended-skill work  dermatology, minor surgery, and other specialist services to the NHS  sometimes need GPs who can flex their time. NASGP can help. Tell us what you're looking for and we'll explore how to support you.</p>
      <div style="background: rgba(255,255,255,.08); border-radius: 14px; padding: 28px 32px; margin-bottom: 40px; max-width: 640px">
        <p style="margin: 0; font-size: 15px; color: #D6DEE8"><strong style="color: #FFFFFF">One thing to be clear about.</strong> NASGP is a membership organisation. We do not sell access to our members. Any arrangement with an independent provider is framed as how NASGP can help  and that support is only offered when it genuinely serves members' interests and portfolio careers.</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px">
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px">
          <h3 style="margin: 0 0 8px; font-size: 21px">Portfolio career support</h3>
          <p style="margin: 0; color: #D6DEE8">Many NASGP members work across NHS and extended-skill roles. We support that range as a career, not a gap to fill.</p>
        </div>
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px">
          <h3 style="margin: 0 0 8px; font-size: 21px">Direct engagement</h3>
          <p style="margin: 0; color: #D6DEE8">GPs who work with independent providers through NASGP do so as self-employed professionals, engaging directly on their own terms.</p>
        </div>
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px">
          <h3 style="margin: 0 0 8px; font-size: 21px">Start with a conversation</h3>
          <p style="margin: 0; color: #D6DEE8">Every independent provider arrangement starts with a conversation about fit. Use the form below and we will come back to you.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Enquiry form -->
  <section id="talk" style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <div style="display: flex; flex-wrap: wrap; gap: 40px 72px">
      <div style="flex: 1 1 360px; min-width: 0">
        <h2 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1.08; letter-spacing: -0.02em">Start a conversation</h2>
        <p style="margin: 14px 0 0; color: #3A4F6B">Tell us a little about your organisation and what you are looking for. We will come back to you within two working days.</p>
        <p style="margin: 20px 0 0; color: #3A4F6B">An NHS commissioner or ICB? <a href="icbs.html" style="font-weight: 600">Go to the ICB and PCN page</a></p>
      </div>
      <form style="flex: 1 1 520px; min-width: 0; background: #EEF6E8; border-radius: 14px; padding: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; align-content: start">
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="p-name" style="font-weight: 600; font-size: 15px">Name</label><input id="p-name" type="text" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="p-email" style="font-weight: 600; font-size: 15px">Work email</label><input id="p-email" type="email" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="p-org" style="font-weight: 600; font-size: 15px">Organisation</label><input id="p-org" type="text" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="p-type" style="font-weight: 600; font-size: 15px">We are</label><select id="p-type" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF"><option>An independent provider (NHS services)</option><option>A training hub or LMC</option><option>A medical defence or professional body</option><option>Something else  I'll explain below</option></select></div>
        <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px"><label for="p-msg" style="font-weight: 600; font-size: 15px">What are you looking for?</label><textarea id="p-msg" rows="4" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF; resize: vertical"></textarea></div>
        <button type="button" style="justify-self: start; font: inherit; font-weight: 700; background: #0B1F33; color: #FFFFFF; border: 0; padding: 16px 26px; border-radius: 6px; cursor: pointer">Send enquiry</button>
      </form>
    </div>
  </section>

  <footer style="background: #0B1F33; color: #D6DEE8; font-size: 15px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; color: #FFFFFF">nasgp</span>
      <span style="display: flex; flex-wrap: wrap; gap: 8px 24px"><a href="about.html" style="color: #D6DEE8">About</a><a href="help.html" style="color: #D6DEE8">Help</a><a href="contact.html" style="color: #D6DEE8">Contact</a><span>© 2026 NASGP</span></span>
    </div>
  </footer>
</div>
</script>
