<link rel="preconnect" href="https://fonts.googleapis.com">

</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-template" id="dc-tpl">

<div style="font-family: 'Inter', system-ui, sans-serif; color: #0B1F33; background: #FFFFFF; font-size: 17px; line-height: 1.55">

  <div style="background: #0B1F33; color: #FFFFFF; font-size: 14px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center">
      <span>The independent membership body for sessional GPs, since 1997</span>
      <div style="display: flex; flex-wrap: wrap; gap: 20px">
        <a href="#" style="color: #FFFFFF; text-decoration: none">Practices: sign in or register</a>
        <a href="#" style="color: #FFFFFF; text-decoration: none; font-weight: 700">Go to LocumDeck</a>
      </div>
    </div>
  </div>
  <header style="border-bottom: 1px solid #DCE6D6; background: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; text-decoration: none" aria-label="NASGP home">
        <span style="background: #4FA83D; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1; padding: 10px 16px 12px">nasgp</span>
        <span style="background: #0B1F33; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-size: 13px; line-height: 1.15; padding: 8px 12px; display: flex; align-items: center; max-width: 150px">National Association of Sessional GPs</span>
      </a>
      <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; font-weight: 500; font-size: 16px">
        <a href="gps.html" style="color: #0B1F33; text-decoration: underline; text-decoration-color: #4FA83D; text-decoration-thickness: 3px; text-underline-offset: 8px">For GPs</a>
        <a href="practices.html" style="color: #0B1F33; text-decoration: none">For practices</a>
        <a href="icbs.html" style="color: #0B1F33; text-decoration: none">For ICBs and PCNs</a>
        <a href="work-with-nasgp.html" style="color: #0B1F33; text-decoration: none">Work with NASGP</a>
        <a href="locumdeck.html" style="color: #0B1F33; text-decoration: none">LocumDeck</a>
        <a href="news.html" style="color: #0B1F33; text-decoration: none">News and guides</a>
        <a href="about.html" style="color: #0B1F33; text-decoration: none">About</a>
        <a href="join.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: 600">Join free</a>
      </nav>
    </div>
  </header>

  <section style="background: #EDE6F5">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; gap: 48px 64px; align-items: center">
      <div style="flex: 1 1 600px; min-width: 0">
        <p style="margin: 0 0 16px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase"><a href="gps.html" style="text-decoration: none">For GPs</a> / Locum Academy</p>
        <h1 style="margin: 0; font-weight: 800; font-size: 60px; line-height: 1.04; letter-spacing: -0.025em">Five short courses on the parts of locum work <span style="position: relative; display: inline-block; white-space: nowrap">nobody taught you.<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span></h1>
        <p style="margin: 24px 0 0; font-size: 20px; max-width: 600px; color: #2A4566">Practical, GP-led modules you can finish in an evening. Each one ends with a short reflection and a certificate for your appraisal.</p>
        <div style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
          <a href="academy-module.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 18px 26px; border-radius: 6px; font-weight: 600">Try the free taster</a>
          <a href="gps.html" style="font-weight: 600; padding: 18px 4px">Included in Professional Plus and Chambers</a>
        </div>
      </div>
      <div style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
        <strong style="font-size: 19px">How each module works</strong>
        <div style="display: flex; gap: 14px; align-items: start"><span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #4FA83D; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span><span>Watch the video and read the notes, about [30 to 45] minutes</span></div>
        <div style="display: flex; gap: 14px; align-items: start"><span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #4FA83D; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span><span>Answer a few reflection questions</span></div>
        <div style="display: flex; gap: 14px; align-items: start"><span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #4FA83D; font-weight: 800; display: flex; align-items: center; justify-content: center">3</span><span>Download your CPD certificate, emailed to you too</span></div>
      </div>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <h2 style="margin: 0 0 40px; font-weight: 800; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em">The modules</h2>
    <div style="display: flex; flex-direction: column; gap: 16px">
      <template data-kind="for" list="{{modules}}" as="m" hint-placeholder-count="5">
        <a href="academy-module.html" style="display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; border: 1px solid #DCE6D6; border-radius: 14px; padding: 24px 28px; text-decoration: none; color: #0B1F33">
          <span style="flex: 0 0 auto; width: 56px; height: 56px; border-radius: 12px; background: {{m.tint}}; font-weight: 800; font-size: 22px; display: flex; align-items: center; justify-content: center">{{m.n}}</span>
          <span style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <strong style="font-size: 20px">{{m.title}}</strong>
            <span style="color: #3A4F6B; font-size: 16px">{{m.summary}}</span>
          </span>
          <span style="flex: 0 0 auto; font-size: 15px; color: #56687F">{{m.time}}</span>
          <span style="flex: 0 0 auto; font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 99px; background: {{m.badgeBg}}; color: #0B1F33">{{m.badge}}</span>
        </a>
      </template>
    </div>
  </section>

  <section style="background: #EEF6E8">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px">
      <div style="background: #FFFFFF; border-radius: 14px; padding: 32px"><h3 style="margin: 0 0 8px; font-size: 21px">Made for appraisal</h3><p style="margin: 0; color: #3A4F6B">Every certificate shows the module, date, time spent and your reflection, so it drops straight into your appraisal portfolio.</p></div>
      <div style="background: #FFFFFF; border-radius: 14px; padding: 32px"><h3 style="margin: 0 0 8px; font-size: 21px">Taught by sessional GPs</h3><p style="margin: 0; color: #3A4F6B">Written and presented by GPs who do the work, about the problems you actually meet in unfamiliar practices.</p></div>
      <div style="background: #FFFFFF; border-radius: 14px; padding: 32px"><h3 style="margin: 0 0 8px; font-size: 21px">Fits round your sessions</h3><p style="margin: 0; color: #3A4F6B">Short videos and notes you can pause and come back to on your phone, laptop or between sessions.</p></div>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <div style="background: #0B1F33; color: #FFFFFF; border-radius: 14px; padding: 56px 48px; display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center; justify-content: space-between">
      <div style="flex: 1 1 520px; min-width: 0">
        <h2 style="margin: 0; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -0.02em">All five modules come with Professional Plus and Chambers.</h2>
        <p style="margin: 12px 0 0; color: #D6DEE8">On Professional at £12? Upgrade to £25 a month from your LocumDeck account and every module unlocks straight away.</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 14px">
        <a href="gps.html" style="background: #4FA83D; color: #0B1F33; text-decoration: none; padding: 18px 26px; border-radius: 6px; font-weight: 700">Compare plans</a>
        <a href="#" style="color: #FFFFFF; font-weight: 600; padding: 18px 8px">Upgrade in LocumDeck</a>
      </div>
    </div>
  </section>

  <footer style="background: #0B1F33; color: #D6DEE8; font-size: 15px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; color: #FFFFFF">nasgp</span>
      <span style="display: flex; flex-wrap: wrap; gap: 8px 24px"><a href="about.html" style="color: #D6DEE8">About</a><a href="help.html" style="color: #D6DEE8">Help</a><a href="contact.html" style="color: #D6DEE8">Contact</a><span>© 2026 NASGP</span></span>
    </div>
  </footer>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3400}}'>
class Component extends DCLogic {
  renderVals() {
    const tints = ['#E2F2DA', '#DDEAF4', '#FCE3DA', '#F7EAD9', '#EDE6F5'];
    const modules = [1, 2, 3, 4, 5].map((n) => ({
      n,
      title: '[Module ' + n + ' title]',
      summary: '[One line on what this module helps you do]',
      time: '[XX] min · [X] CPD hours',
      tint: tints[n - 1],
      badge: n === 1 ? 'Free taster' : 'Members',
      badgeBg: n === 1 ? '#4FA83D' : '#EEF6E8'
    }));
    return { modules };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
