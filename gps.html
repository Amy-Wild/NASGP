        <template data-kind="for" list="{{faqs}}" as="q" hint-placeholder-count="5">
          <div style="border-top: 1px solid #DCE6D6">
            <button type="button" onClick="{{q.toggle}}" aria-expanded="{{q.open}}" style="width: 100%; background: none; border: 0; padding: 22px 0; font: inherit; font-weight: 600; font-size: 19px; color: #0B1F33; text-align: left; display: flex; justify-content: space-between; gap: 16px; cursor: pointer"><span>{{q.q}}</span><span aria-hidden="true" style="font-size: 24px; line-height: 1; color: #0B1F33">{{q.sign}}</span></button>
            <template data-kind="if" value="{{q.open}}" hint-placeholder-val="{{ false }}">

  </section>

  <!-- Be seen, be counted -->
  <section style="background: #0B1F33; color: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
      <div style="display: flex; flex-wrap: wrap; gap: 40px 72px; align-items: start">
        <div style="flex: 1 1 460px; min-width: 0">
          <p style="margin: 0 0 12px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #F2765A">Be seen, be counted</p>
          <h2 style="margin: 0; font-family: 'Inter', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.02em; font-size: 44px; line-height: 1.1">Sessional GPs who aren't visible can't be planned for.</h2>
          <p style="margin: 18px 0 0; color: #D4DCE4; font-size: 19px">Sessional GPs are often scattered across agencies, platforms and WhatsApp groups, invisible to the NHS planners who make funding and workforce decisions. That invisibility has cost the workforce funding and opportunities.</p>
          <p style="margin: 18px 0 0; color: #D4DCE4; font-size: 19px">Every GP on LocumDeck keeps full independence and privacy. Your personal data is yours. But together, as an anonymised, aggregated workforce, sessional GPs become visible  and NASGP can advocate with evidence behind it.</p>
          <p style="margin: 18px 0 0; color: #D4DCE4; font-size: 19px">Advocacy that is backed by data brings more work, better rates and planning decisions that don't overlook sessional GPs. That is what membership, combined with LocumDeck, makes possible.</p>
          <div style="margin-top: 24px; background: rgba(255,255,255,.08); border-radius: 10px; padding: 18px 22px">
            <p style="margin: 0; font-size: 15px; color: #D4DCE4"><strong style="color: #FFFFFF">On data and privacy.</strong> NASGP uses only anonymised, aggregated data when advocating for the workforce or working with commissioners. No member's personal data or individual records are shared with any third party.</p>
          </div>
        </div>
        <div style="flex: 1 1 340px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; border-top: 2px solid #4FA83D; align-content: start">
          <div style="padding: 24px 24px 0 0">
            <div style="font-family: 'Inter', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.02em; font-size: 52px; line-height: 1">7,000+</div>
            <p style="margin: 8px 0 0; color: #D4DCE4">members and community in one place</p>
          </div>
          <div style="padding: 24px 24px 0 0">
            <div style="font-family: 'Inter', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.02em; font-size: 52px; line-height: 1">30</div>
            <p style="margin: 8px 0 0; color: #D4DCE4">years of independent advocacy</p>

  <section style="max-width: 1240px; margin: 0 auto; padding: 0 24px 96px">

</script>
<script type="text/x-dc" data-dc-script data-props='{"tier1Price":{"editor":"int","default":12,"section":"Pricing"},"tier2Price":{"editor":"int","default":25,"section":"Pricing"},"tier3Price":{"editor":"int","default":45,"section":"Pricing"},"standardFee":{"editor":"int","default":15,"section":"Pricing"},"chambersFee":{"editor":"int","default":11,"section":"Pricing"},"$preview":{"width":1440,"height":5200}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { days: 6, open: 0 };
  }
  renderVals() {
    const p1 = this.props.tier1Price ?? 12;
    const p2 = this.props.tier2Price ?? 25;
    const p3 = this.props.tier3Price ?? 45;
    const f1 = this.props.standardFee ?? 15;
    const f3 = this.props.chambersFee ?? 11;
    const d = this.state.days;
    const plans = [
      { name: 'Professional', total: p1 + f1 * d },
      { name: 'Professional Plus', total: p2 + f1 * d },
      { name: 'Locum Chambers', total: p3 + f3 * d }
    ];
    const plusVsCh = (p2 + f1 * d) - (p3 + f3 * d);
    const breakeven = Math.ceil((p3 - p2) / Math.max(1, f1 - f3));
    const rows = plans.map((p, i) => {
      const best = (i === 1 && plusVsCh <= 0) || (i === 2 && plusVsCh > 0);
      return {
        name: p.name,
        total: p.total,
        bg: best ? '#E2F2DA' : '#FFFFFF',
        border: best ? '2px solid #2F6B22' : '1px solid #DCE6D6'
      };
    });
    const verdict = plusVsCh > 0
      ? 'At ' + d + ' days, Chambers saves you £' + plusVsCh + ' a month over Professional Plus, and adds your local peer group.'
      : 'Chambers starts to pay for itself at ' + breakeven + ' booked days a month. Below that, Professional Plus works out cheaper.';
    const faqData = [
      { q: 'What happens after the 3 free months?', a: '[CONFIRM: does the trial roll onto the plan you chose, and how much notice do members get before the first payment?]' },
      { q: 'Who pays the booking fee?', a: 'You do, once per booked day, however many sessions you work that day. Practices use LocumDeck free.' },
      { q: 'Can I switch plans?', a: 'Yes. Upgrade or downgrade from your account at any time. [CONFIRM how changes are billed.]' },
      { q: 'Are there practices booking near me?', a: '[Link to a live map or count of practices by area, once the data is available.]' },
      { q: 'I am a GP registrar. Can I join?', a: 'Yes. GP registrars can join ahead of CCT so you are ready to work from day one. [Link to registrar page]' }
    ];
    const faqs = faqData.map((f, i) => ({
      q: f.q, a: f.a,
      open: this.state.open === i,
      sign: this.state.open === i ? '−' : '+',
      toggle: () => this.setState({ open: this.state.open === i ? -1 : i })
    }));
    return {
      p1, p2, p3, f1, f2: f1, f3,
      days: d,
      setDays: (e) => this.setState({ days: Number(e.target.value) }),
      rows, verdict, faqs
    };
  }
}
</script>
<script src="dc-lite.js"></script>
