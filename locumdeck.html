<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LocumDeck | NASGP preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0B1F33}a:hover{color:#2F6B22}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-template" id="dc-tpl">

<div style="font-family: 'Inter', system-ui, sans-serif; color: #0B1F33; background: #FFFFFF; font-size: 17px; line-height: 1.55">

  <div style="background: #0B1F33; color: #FFFFFF; font-size: 14px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center">
      <span>The independent membership body for sessional GPs, since 1997</span>
      <div style="display: flex; flex-wrap: wrap; gap: 20px">
        <a href="#" style="color: #FFFFFF; text-decoration: none">Practices: sign in or register</a>
        <a href="#" style="color: #FFFFFF; text-decoration: none; font-weight: 700">Go to LocumDeck</a>
      </div>
    </div>
  </div>
  <header style="border-bottom: 1px solid #DCE6D6; background: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; text-decoration: none" aria-label="NASGP home">
        <span style="background: #4FA83D; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1; padding: 10px 16px 12px">nasgp</span>
        <span style="background: #0B1F33; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-size: 13px; line-height: 1.15; padding: 8px 12px; display: flex; align-items: center; max-width: 150px">National Association of Sessional GPs</span>
      </a>
      <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; font-weight: 500; font-size: 16px">
        <a href="gps.html" style="color: #0B1F33; text-decoration: none">For GPs</a>
        <a href="practices.html" style="color: #0B1F33; text-decoration: none">For practices</a>
        <a href="icbs.html" style="color: #0B1F33; text-decoration: none">For ICBs and PCNs</a>
        <a href="locumdeck.html" style="color: #0B1F33; text-decoration: underline; text-decoration-color: #4FA83D; text-decoration-thickness: 3px; text-underline-offset: 8px">LocumDeck</a>
        <a href="news.html" style="color: #0B1F33; text-decoration: none">News and guides</a>
        <a href="about.html" style="color: #0B1F33; text-decoration: none">About</a>
        <a href="join.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: 600">Get started</a>
      </nav>
    </div>
    <nav aria-label="Member resources" style="border-top: 1px solid #DCE6D6; background: #FAFBF9">
      <div style="max-width: 1240px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; gap: 0 20px; font-size: 14px; font-weight: 500">
        <a href="community.html" style="color: #33475B; text-decoration: none; padding: 4px 0">Community</a>
        <a href="academy.html" style="color: #33475B; text-decoration: none; padding: 4px 8px">Academy</a>
        <a href="campaigns.html" style="color: #33475B; text-decoration: none; padding: 4px 8px">Campaigns</a>
        <a href="chambers.html" style="color: #33475B; text-decoration: none; padding: 4px 8px">Chambers</a>
        <a href="resource-hub.html" style="color: #33475B; text-decoration: none; padding: 4px 8px">Resources</a>
        <a href="locumdeck.html" style="color: #33475B; text-decoration: none; padding: 4px 8px">LocumDeck</a>
        <a href="news.html" style="color: #33475B; text-decoration: none; padding: 4px 8px">News and guides</a>
      </div>
    </nav>
  </header>

  <section style="background: #EEF6E8">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px 0; text-align: center; display: flex; flex-direction: column; align-items: center">
      <p style="margin: 0 0 16px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #2F6B22">LocumDeck · Built by GPs, for GPs</p>
      <h1 style="margin: 0; font-weight: 800; font-size: 64px; line-height: 1.03; letter-spacing: -0.025em; max-width: 900px"><span style="position: relative; display: inline-block; white-space: nowrap">One place<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span> for sessional GP work, from booking to pension form.</h1>
      <p style="margin: 24px 0 0; font-size: 20px; max-width: 680px; color: #3A4F6B">GPs share availability and terms. Practices book them directly. Invoices, pensions and tax records follow automatically. No agency in the middle.</p>
      <div style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: center">
        <a href="gps.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 18px 26px; border-radius: 6px; font-weight: 600">I'm a GP</a>
        <a href="practices.html" style="background: #4FA83D; color: #0B1F33; text-decoration: none; padding: 18px 26px; border-radius: 6px; font-weight: 700">I'm a practice</a>
      </div>
      <!-- Product frame -->
      <div style="margin-top: 64px; width: 100%; max-width: 1040px; background: #FFFFFF; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 40px rgba(14,45,87,.12); overflow: hidden; text-align: left">
        <div style="background: #0B1F33; padding: 12px 20px; display: flex; gap: 8px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: #56687F"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #56687F"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #56687F"></span><span style="margin-left: 12px; color: #D6DEE8; font-size: 13px">LocumDeck · My calendar</span></div>
        <div style="padding: 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; font-size: 14px">
          <template data-kind="for" list="{{week}}" as="d" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <strong>{{d.day}}</strong>
              <div style="border-radius: 8px; padding: 10px; min-height: 52px; background: {{d.amBg}}">{{d.am}}</div>
              <div style="border-radius: 8px; padding: 10px; min-height: 52px; background: {{d.pmBg}}">{{d.pm}}</div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <h2 style="margin: 0 0 48px; font-weight: 800; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em">What LocumDeck does</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px">
      <template data-kind="for" list="{{features}}" as="f" hint-placeholder-count="6">
        <div style="background: {{f.bg}}; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 10px">
          <span style="align-self: start; background: #FFFFFF; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 99px">{{f.who}}</span>
          <h3 style="margin: 0; font-size: 22px; font-weight: 700">{{f.title}}</h3>
          <p style="margin: 0; color: #2A4566">{{f.body}}</p>
        </div>
      </template>
    </div>
  </section>

  <section style="background: #0B1F33; color: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 48px; align-items: center">
      <div>
        <p style="margin: 0 0 12px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #F2765A">Instant Book</p>
        <h2 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1.08; letter-spacing: -0.02em">Why we don't do direct messaging</h2>
      </div>
      <p style="margin: 0; font-size: 19px; color: #D6DEE8">If LocumDeck were just a place to message GPs, it would become an address book and availability would go stale. Instead, practices see live availability with terms and credentials attached, and book in one step. Once booked, both sides get each other's details for any questions.</p>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px">
      <div style="border: 1px solid #DCE6D6; border-radius: 14px; padding: 28px"><h3 style="margin: 0 0 8px; font-size: 20px">Not just GPs</h3><p style="margin: 0; color: #3A4F6B">Nurses, nursing associates and healthcare assistants since 2021. Practice administrators and receptionists since 2023.</p></div>
      <div style="border: 1px solid #DCE6D6; border-radius: 14px; padding: 28px"><h3 style="margin: 0 0 8px; font-size: 20px">Secure by design</h3><p style="margin: 0; color: #3A4F6B">ISO 27001 certified and a registered NHS digital supplier on G-Cloud.</p></div>
      <div style="border: 1px solid #DCE6D6; border-radius: 14px; padding: 28px"><h3 style="margin: 0 0 8px; font-size: 20px">Award-winning</h3><p style="margin: 0; color: #3A4F6B">[Name the awards and years.]</p></div>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 0 24px 96px">
    <div style="background: #4FA83D; border-radius: 14px; padding: 56px 48px; display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center; justify-content: space-between">
      <h2 style="flex: 1 1 520px; margin: 0; font-weight: 800; font-size: 44px; line-height: 1.08; letter-spacing: -0.02em">Free for practices. Three months free for GPs.</h2>
      <a href="join.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 18px 26px; border-radius: 6px; font-weight: 600">Get started</a>
    </div>
  </section>

  <footer style="background: #0B1F33; color: #D6DEE8; font-size: 15px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; color: #FFFFFF">nasgp</span>
      <span style="display: flex; flex-wrap: wrap; gap: 8px 24px"><a href="about.html" style="color: #D6DEE8">About</a><a href="help.html" style="color: #D6DEE8">Help</a><a href="contact.html" style="color: #D6DEE8">Contact</a><span>© 2026 NASGP</span></span>
    </div>
  </footer>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4400}}'>
class Component extends DCLogic {
  renderVals() {
    const open = '#E2F2DA', booked = '#DDEAF4', off = '#EEF6E8';
    return {
      week: [
        { day: 'Mon', am: 'Booked · [Practice]', amBg: booked, pm: 'Booked · [Practice]', pmBg: booked },
        { day: 'Tue', am: 'Available', amBg: open, pm: 'Available', pmBg: open },
        { day: 'Wed', am: 'Not working', amBg: off, pm: 'Not working', pmBg: off },
        { day: 'Thu', am: 'Booked · [Practice]', amBg: booked, pm: 'Remote available', pmBg: open },
        { day: 'Fri', am: 'Available', amBg: open, pm: 'Not working', pmBg: off }
      ],
      features: [
        { who: 'GPs', bg: '#E2F2DA', title: 'Availability and terms', body: 'Set your sessions, rates and terms once. Practices see them before they book, so there is nothing to renegotiate.' },
        { who: 'Practices', bg: '#FCE3DA', title: 'Instant Book and requests', body: 'Book available GPs straight away, or request a session and NASGP alerts local GPs who can offer to cover it.' },
        { who: 'GPs', bg: '#DDEAF4', title: 'Invoices and pensions', body: 'Invoices and Locum A and B forms are produced and sent automatically. Late fees can be chased for you.' },
        { who: 'GPs', bg: '#EDE6F5', title: 'Making Tax Digital', body: 'Session income and common GP expenses recorded as you go, ready for your quarterly update.' },
        { who: 'Both', bg: '#F7EAD9', title: 'Remote sessions', body: 'Practices on EMIS can book remote GP sessions through LocumDeck. SystmOne practices can too, set up through their ICB.' },
        { who: 'Both', bg: '#E2F2DA', title: 'Private jobs board', body: 'Locum and salaried GP vacancies, visible only to GPs and practices on LocumDeck.' }
      ]
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
