<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NASGP membership and plans | NASGP preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0B1F33}a:hover{color:#2F6B22}
input[type=range]{accent-color:#0B1F33}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-template" id="dc-tpl">

<div style="font-family: 'Inter', system-ui, sans-serif; color: #0B1F33; background: #FFFFFF; font-size: 17px; line-height: 1.55">

  <div style="background: #0B1F33; color: #FFFFFF; font-size: 14px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center">
      <span>The independent membership body for sessional GPs, since 1997</span>
      <div style="display: flex; flex-wrap: wrap; gap: 20px">
        <a href="#" style="color: #FFFFFF; text-decoration: none">Practices: sign in or register</a>
        <a href="#" style="color: #FFFFFF; text-decoration: none; font-weight: 700">Go to LocumDeck</a>
      </div>
    </div>
  </div>
  <header style="border-bottom: 1px solid #DCE6D6; background: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; text-decoration: none" aria-label="NASGP home">
        <span style="background: #4FA83D; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1; padding: 10px 16px 12px">nasgp</span>
        <span style="background: #0B1F33; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-size: 13px; line-height: 1.15; padding: 8px 12px; display: flex; align-items: center; max-width: 150px">National Association of Sessional GPs</span>
      </a>
      <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; font-weight: 500; font-size: 16px">
        <a href="gps.html" style="color: #0B1F33; text-decoration: underline; text-decoration-color: #4FA83D; text-decoration-thickness: 3px; text-underline-offset: 8px">For GPs</a>
        <a href="practices.html" style="color: #0B1F33; text-decoration: none">For practices</a>
        <a href="icbs.html" style="color: #0B1F33; text-decoration: none">For ICBs and PCNs</a>
        <a href="work-with-nasgp.html" style="color: #0B1F33; text-decoration: none">Work with NASGP</a>
        <a href="locumdeck.html" style="color: #0B1F33; text-decoration: none">LocumDeck</a>
        <a href="news.html" style="color: #0B1F33; text-decoration: none">News and guides</a>
        <a href="about.html" style="color: #0B1F33; text-decoration: none">About</a>
        <a href="join.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: 600">Start 3 months free</a>
      </nav>
    </div>
  </header>

  <section style="background: #EEF6E8">
    <div style="max-width: 1240px; margin: 0 auto; padding: 80px 24px 72px">
      <p style="margin: 0 0 16px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #2F6B22"><a href="gps.html" style="text-decoration: none; color: #2F6B22">For GPs</a> / Membership</p>
      <h1 style="margin: 0; font-weight: 800; font-size: 60px; line-height: 1.04; letter-spacing: -0.025em; max-width: 900px">Not a job board. A booking channel and back office that <span style="position: relative; display: inline-block; white-space: nowrap">pays for itself.<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span></h1>
      <p style="margin: 24px 0 0; font-size: 20px; max-width: 680px; color: #3A4F6B">Practices pay nothing to book you, so they come to LocumDeck first. Your membership puts you in front of them, and takes the invoicing, pension forms and tax records off your evenings.</p>
    </div>
  </section>

  <!-- Why practices prefer -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 88px 24px 40px">
    <h2 style="margin: 0 0 36px; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; max-width: 760px">Why practices book through LocumDeck</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px">
      <div style="border-top: 3px solid #4FA83D; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">No markup for them</h3><p style="margin: 0; color: #3A4F6B">Practices pay your fee and nothing else. No agency margin, no booking fee. Their budget goes on care.</p></div>
      <div style="border-top: 3px solid #4FA83D; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Your credentials, up front</h3><p style="margin: 0; color: #3A4F6B">GMC, DBS, indemnity and references sit on your profile, so practices can book you without the chasing.</p></div>
      <div style="border-top: 3px solid #4FA83D; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Book in one step</h3><p style="margin: 0; color: #3A4F6B">Instant Book confirms the session on your terms. No back-and-forth, so you get chosen over the GP who takes a day to reply.</p></div>
    </div>
  </section>

  <!-- What £12 replaces -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 48px 24px 88px">
    <div style="background: #DDEAF4; border-radius: 14px; padding: 40px; display: flex; flex-wrap: wrap; gap: 28px 56px; align-items: center">
      <div style="flex: 1 1 380px; min-width: 0">
        <p style="margin: 0 0 8px; font-weight: 700; font-size: 15px">Professional, £12 a month</p>
        <h2 style="margin: 0; font-weight: 800; font-size: 34px; line-height: 1.12; letter-spacing: -0.02em">What £12 a month takes off your hands</h2>
        <p style="margin: 12px 0 0; color: #2A4566">Less than the cost of one hour of an accountant's time.</p>
      </div>
      <div style="flex: 1 1 480px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 28px">
        <div style="padding: 14px 0; border-top: 1px solid rgba(11,31,51,.15)"><strong>Writing invoices</strong><br><span style="color: #2A4566; font-size: 15px">Created and sent after every session</span></div>
        <div style="padding: 14px 0; border-top: 1px solid rgba(11,31,51,.15)"><strong>Chasing payment</strong><br><span style="color: #2A4566; font-size: 15px">Reminders sent, late fees chased</span></div>
        <div style="padding: 14px 0; border-top: 1px solid rgba(11,31,51,.15)"><strong>Locum A and B forms</strong><br><span style="color: #2A4566; font-size: 15px">Filled in and sent for you</span></div>
        <div style="padding: 14px 0; border-top: 1px solid rgba(11,31,51,.15)"><strong>Tax records</strong><br><span style="color: #2A4566; font-size: 15px">Ready for Making Tax Digital</span></div>
        <div style="padding: 14px 0; border-top: 1px solid rgba(11,31,51,.15)"><strong>Arranging bookings</strong><br><span style="color: #2A4566; font-size: 15px">No calls, emails or WhatsApp</span></div>
        <div style="padding: 14px 0; border-top: 1px solid rgba(11,31,51,.15)"><strong>Repeating your terms</strong><br><span style="color: #2A4566; font-size: 15px">Set once, attached to every booking</span></div>
      </div>
    </div>
  </section>

  <!-- Matrix -->
  <section style="background: #EEF6E8">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px">
      <div style="display: flex; flex-wrap: wrap; gap: 16px 48px; align-items: end; justify-content: space-between; margin-bottom: 32px">
        <h2 style="margin: 0; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em">Compare the plans</h2>
        <p style="margin: 0; color: #3A4F6B; max-width: 440px">Every plan starts with 3 months free. Booking fees are charged once per booked day, however many sessions. All fees tax-deductible.</p>
      </div>
      <div style="overflow-x: auto; background: #FFFFFF; border-radius: 14px; border: 1px solid #DCE6D6">
        <table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 16px">
          <thead>
            <tr style="text-align: left; vertical-align: top">
              <th style="padding: 24px; border-bottom: 1px solid #DCE6D6; width: 34%"></th>
              <th style="padding: 24px; border-bottom: 1px solid #DCE6D6"><div style="font-size: 18px">Professional</div><div style="font-size: 36px; font-weight: 800; letter-spacing: -0.02em">£12</div><div style="font-weight: 500; color: #56687F; font-size: 14px">a month + £15 a booked day</div></th>
              <th style="padding: 24px; border-bottom: 1px solid #DCE6D6"><div style="font-size: 18px">Professional Plus</div><div style="font-size: 36px; font-weight: 800; letter-spacing: -0.02em">£25</div><div style="font-weight: 500; color: #56687F; font-size: 14px">a month + £15 a booked day</div></th>
              <th style="padding: 24px; border-bottom: 1px solid #DCE6D6; background: #0B1F33; color: #FFFFFF"><div style="font-size: 18px">Locum Chambers</div><div style="font-size: 36px; font-weight: 800; letter-spacing: -0.02em">£45</div><div style="font-weight: 500; color: #D6DEE8; font-size: 14px">a month + £11 a booked day</div></th>
            </tr>
          </thead>
          <tbody>
            <template data-kind="for" list="{{rows}}" as="r" hint-placeholder-count="10">
              <tr>
                <td style="padding: 14px 24px; border-bottom: 1px solid #DCE6D6; font-weight: 600; background: {{r.headBg}}">{{r.label}}</td>
                <td style="padding: 14px 24px; border-bottom: 1px solid #DCE6D6; color: {{r.c1}}; font-weight: 600">{{r.a}}</td>
                <td style="padding: 14px 24px; border-bottom: 1px solid #DCE6D6; color: {{r.c2}}; font-weight: 600">{{r.b}}</td>
                <td style="padding: 14px 24px; border-bottom: 1px solid #DCE6D6; background: #F4F9F1; color: {{r.c3}}; font-weight: 600">{{r.c}}</td>
              </tr>
            </template>
            <tr>
              <td style="padding: 18px 24px; font-weight: 600">Best for</td>
              <td style="padding: 18px 24px; color: #3A4F6B">GPs who want the platform and the admin sorted</td>
              <td style="padding: 18px 24px; color: #3A4F6B">GPs building a career, not just a diary</td>
              <td style="padding: 18px 24px; background: #F4F9F1; color: #3A4F6B">Busy GPs who want a local peer group</td>
            </tr>
            <tr>
              <td style="padding: 0 24px 24px"></td>
              <td style="padding: 0 24px 24px"><a href="join.html" style="display: inline-block; border: 1px solid #0B1F33; text-decoration: none; padding: 12px 18px; border-radius: 6px; font-weight: 600">Start free</a></td>
              <td style="padding: 0 24px 24px"><a href="join.html" style="display: inline-block; border: 1px solid #0B1F33; text-decoration: none; padding: 12px 18px; border-radius: 6px; font-weight: 600">Start free</a></td>
              <td style="padding: 0 24px 24px; background: #F4F9F1"><a href="join.html" style="display: inline-block; background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 12px 18px; border-radius: 6px; font-weight: 600">Start free</a></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Mini calculator -->
      <div style="margin-top: 24px; background: #FFFFFF; border-radius: 14px; padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 20px 48px; align-items: center">
        <div style="flex: 1 1 380px; min-width: 0">
          <label for="mdays" style="font-weight: 600">Days a month booked through LocumDeck: <span style="font-size: 26px; font-weight: 800">{{days}}</span></label>
          <input id="mdays" type="range" min="0" max="20" step="1" value="{{days}}" onChange="{{setDays}}" style="width: 100%; margin-top: 10px; height: 32px">
        </div>
        <p style="flex: 1 1 380px; margin: 0; font-size: 18px"><strong>{{verdict}}</strong> {{detail}}</p>
      </div>
    </div>
  </section>

  <!-- ICB funded -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 72px 24px 0">
    <div style="border: 1px solid #DCE6D6; border-radius: 14px; padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 12px 40px; align-items: center; justify-content: space-between">
      <p style="margin: 0; max-width: 760px"><strong>Working in Suffolk, Essex, Gloucestershire or another partner area?</strong> Your local ICB may fund your membership and booking fees in full.</p>
      <a href="icbs.html" style="font-weight: 600">Check funded areas</a>
    </div>
  </section>

  <!-- FAQ -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 72px 24px 96px">
    <div style="display: flex; flex-wrap: wrap; gap: 32px 72px">
      <h2 style="flex: 1 1 320px; margin: 0; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em">Money questions</h2>
      <div style="flex: 2 1 560px; min-width: 0">
        <template data-kind="for" list="{{faqs}}" as="q" hint-placeholder-count="5">
          <div style="border-top: 1px solid #DCE6D6">
            <button type="button" onClick="{{q.toggle}}" aria-expanded="{{q.open}}" style="width: 100%; background: none; border: 0; padding: 20px 0; font: inherit; font-weight: 600; font-size: 19px; color: #0B1F33; text-align: left; display: flex; justify-content: space-between; gap: 16px; cursor: pointer"><span>{{q.q}}</span><span aria-hidden="true" style="font-size: 24px; line-height: 1; color: #2F6B22">{{q.sign}}</span></button>
            <template data-kind="if" value="{{q.open}}" hint-placeholder-val="{{ false }}">
              <p style="margin: 0 0 20px; color: #3A4F6B; max-width: 680px">{{q.a}}</p>
            </template>
          </div>
        </template>
      </div>
    </div>
  </section>

  <footer style="background: #0B1F33; color: #D6DEE8; font-size: 15px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; color: #FFFFFF">nasgp</span>
      <span style="display: flex; flex-wrap: wrap; gap: 8px 24px"><a href="about.html" style="color: #D6DEE8">About</a><a href="help.html" style="color: #D6DEE8">Help</a><a href="contact.html" style="color: #D6DEE8">Contact</a><span>© 2026 NASGP</span></span>
    </div>
  </footer>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4200}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { days: 4, open: 0 }; }
  renderVals() {
    const yes = '✓', no = '—';
    const data = [
      ['LocumDeck profile, bookings and Instant Book', 1],
      ['Automatic invoices and payment reminders', 1],
      ['Locum A and B pension forms', 1],
      ['Making Tax Digital records', 1],
      ['Templates and guides in the Resource Hub', 1],
      ['Locum Academy with CPD certificates', 2],
      ['Mentoring and appraisal support', 2],
      ['Private Chambers webinars', 3],
      ['Local chambers group and admin support', 3],
      ['Priority access to expert advice', 3]
    ];
    const rows = data.map(([label, need], i) => ({
      label,
      a: need <= 1 ? yes : no, b: need <= 2 ? yes : no, c: yes,
      c1: need <= 1 ? '#2F6B22' : '#8A97A3', c2: need <= 2 ? '#2F6B22' : '#8A97A3', c3: '#2F6B22',
      headBg: '#FFFFFF'
    }));
    const d = this.state.days;
    const cost = [12 + 15 * d, 25 + 15 * d, 45 + 11 * d];
    const names = ['Professional', 'Professional Plus', 'Locum Chambers'];
    let verdict, detail;
    if (cost[2] <= cost[1]) {
      verdict = 'Chambers works out at £' + cost[2] + ' a month.';
      detail = 'That’s £' + (cost[1] - cost[2]) + ' less than Professional Plus at ' + d + ' days, with the peer group and webinars on top.';
    } else {
      verdict = 'Professional is £' + cost[0] + ' a month at ' + d + ' days.';
      detail = 'Plus adds the Academy and mentoring for £13 more. Chambers starts paying for itself at 5 booked days a month.';
    }
    const faqData = [
      { q: 'What happens after 3 months free?', a: '[CONFIRM: trial rolls onto your chosen plan, with notice before the first payment.]' },
      { q: 'Who pays the booking fee?', a: 'You do, once per booked day. Practices use LocumDeck free, which is why they book through it.' },
      { q: 'Can I switch plans later?', a: 'Yes, up or down from your LocumDeck account at any time. [CONFIRM how changes are billed.]' },
      { q: 'Are the fees tax-deductible?', a: 'Yes. Membership and booking fees count as business expenses.' },
      { q: 'Is it cheaper than an agency?', a: 'Agencies take a margin from the practice-facing rate on every session. On LocumDeck you set your own rate and keep it, paying a flat booking fee instead.' }
    ];
    const faqs = faqData.map((f, i) => ({ q: f.q, a: f.a, open: this.state.open === i, sign: this.state.open === i ? '−' : '+', toggle: () => this.setState({ open: this.state.open === i ? -1 : i }) }));
    return { rows, days: d, setDays: (e) => this.setState({ days: Number(e.target.value) }), verdict, detail, faqs };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
