<div style="font-family: 'Inter', system-ui, sans-serif; color: #0B1F33; background: #FFFFFF; font-size: 17px; line-height: 1.55">

  <div style="background: #0B1F33; color: #FFFFFF; font-size: 14px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center">
      <span>The independent membership body for sessional GPs, since 1997</span>
      <div style="display: flex; flex-wrap: wrap; gap: 20px">
        <a href="#" style="color: #FFFFFF; text-decoration: none">Practices: sign in or register</a>
        <a href="#" style="color: #FFFFFF; text-decoration: none; font-weight: 700">Go to LocumDeck</a>
      </div>
    </div>
  </div>
  <header style="border-bottom: 1px solid #DCE6D6; background: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; text-decoration: none" aria-label="NASGP home">
        <span style="background: #4FA83D; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1; padding: 10px 16px 12px">nasgp</span>
        <span style="background: #0B1F33; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-size: 13px; line-height: 1.15; padding: 8px 12px; display: flex; align-items: center; max-width: 150px">National Association of Sessional GPs</span>
      </a>
      <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; font-weight: 500; font-size: 16px">
        <a href="gps.html" style="color: #0B1F33; text-decoration: none">For GPs</a>
        <a href="practices.html" style="color: #0B1F33; text-decoration: none">For practices</a>
        <a href="icbs.html" style="color: #0B1F33; text-decoration: none">For ICBs and PCNs</a>
        <a href="partnerships.html" style="color: #0B1F33; text-decoration: underline; text-decoration-color: #4FA83D; text-decoration-thickness: 3px; text-underline-offset: 8px">Partnerships</a>
        <a href="partnerships.html" style="color: #0B1F33; text-decoration: none">Partnerships</a>
        <a href="locumdeck.html" style="color: #0B1F33; text-decoration: none">LocumDeck</a>
        <a href="news.html" style="color: #0B1F33; text-decoration: none">News and guides</a>
        <a href="#talk" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: 600">Talk to us</a>
      </nav>
    </div>
  </header>

  <section style="background: #EEF6E8">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px 72px">
      <p style="margin: 0 0 16px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #2F6B22">Partnerships</p>
      <h1 style="margin: 0; font-weight: 800; font-size: 60px; line-height: 1.04; letter-spacing: -0.025em; max-width: 920px">Work with the UK's independent network of <span style="position: relative; display: inline-block; white-space: nowrap">sessional GPs.<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span></h1>
      <p style="margin: 24px 0 0; font-size: 20px; max-width: 700px; color: #3A4F6B">Whether you run a private GP service that needs reliable cover, or you offer something sessional GPs need, there's a way to work together.</p>
      <div style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 14px">
        <a href="#private" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 16px 24px; border-radius: 6px; font-weight: 600">I run a private GP service</a>
        <a href="#commercial" style="background: #FFFFFF; color: #0B1F33; text-decoration: none; padding: 15px 23px; border-radius: 6px; font-weight: 600; border: 1px solid #0B1F33">I want to reach GP members</a>
      </div>
    </div>
  </section>

  <!-- Proof strip -->
  <section aria-label="Partners and providers we work with" style="background: #FFFFFF; border-bottom: 1px solid #DCE6D6">
    <div style="max-width: 1240px; margin: 0 auto; padding: 36px 24px; display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: center">
      <p style="flex: 0 1 220px; margin: 0; font-size: 15px; font-weight: 700; color: #0B1F33">Partners and providers we work with<span style="display: block; margin-top: 6px; font-weight: 500; font-size: 13px; color: #56687F">[Add partners who agree to be shown]</span></p>
      <div style="flex: 1 1 640px; min-width: 0; display: flex; flex-wrap: wrap; gap: 18px 22px; justify-content: space-between"><div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 150px"><div style="width: 150px; height: 64px; border: 1px dashed #DCE6D6; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #56687F">[Logo]</div><span style="font-size: 12px; line-height: 1.3; text-align: center; color: #56687F">[Private provider]</span></div><div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 150px"><div style="width: 150px; height: 64px; border: 1px dashed #DCE6D6; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #56687F">[Logo]</div><span style="font-size: 12px; line-height: 1.3; text-align: center; color: #56687F">[Out-of-hours provider]</span></div><div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 150px"><div style="width: 150px; height: 64px; border: 1px dashed #DCE6D6; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #56687F">[Logo]</div><span style="font-size: 12px; line-height: 1.3; text-align: center; color: #56687F">[Indemnity partner]</span></div><div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 150px"><div style="width: 150px; height: 64px; border: 1px dashed #DCE6D6; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #56687F">[Logo]</div><span style="font-size: 12px; line-height: 1.3; text-align: center; color: #56687F">[Accountancy partner]</span></div><div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 150px"><div style="width: 150px; height: 64px; border: 1px dashed #DCE6D6; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #56687F">[Logo]</div><span style="font-size: 12px; line-height: 1.3; text-align: center; color: #56687F">[Insurance partner]</span></div><div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 150px"><div style="width: 150px; height: 64px; border: 1px dashed #DCE6D6; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #56687F">[Logo]</div><span style="font-size: 12px; line-height: 1.3; text-align: center; color: #56687F">[Learning partner]</span></div></div>
    </div>
  </section>


  <!-- Private practice -->
  <section id="private" style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <div style="display: flex; flex-wrap: wrap; gap: 40px 64px; align-items: start">
      <div style="flex: 1 1 460px; min-width: 0">
        <p style="margin: 0 0 12px; font-weight: 700; font-size: 15px; color: #2F6B22">Private practice and independent providers</p>
        <h2 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1.08; letter-spacing: -0.02em">Experienced NHS GPs for your private clinics, booked directly.</h2>
        <p style="margin: 18px 0 0; color: #3A4F6B; font-size: 19px">Private GP services, out-of-hours and urgent care providers, occupational health and corporate health teams can book sessional GPs through LocumDeck, with credentials checked and terms agreed up front.</p>
      </div>
      <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <div style="background: #E2F2DA; border-radius: 14px; padding: 22px 24px"><strong>GPs you can check before you book</strong><p style="margin: 4px 0 0; color: #2A4566; font-size: 16px">GMC registration, DBS, indemnity and references on every profile.</p></div>
        <div style="background: #DDEAF4; border-radius: 14px; padding: 22px 24px"><strong>Regular cover, not one-offs</strong><p style="margin: 4px 0 0; color: #2A4566; font-size: 16px">Build a bank of GPs who know your clinics, your systems and your patients.</p></div>
        <div style="background: #FCE3DA; border-radius: 14px; padding: 22px 24px"><strong>In person or remote</strong><p style="margin: 4px 0 0; color: #2A4566; font-size: 16px">Book face-to-face sessions or GPs who consult remotely. [CONFIRM remote setup for private providers]</p></div>
        <div style="background: #EDE6F5; border-radius: 14px; padding: 22px 24px"><strong>Simple admin</strong><p style="margin: 4px 0 0; color: #2A4566; font-size: 16px">Bookings, invoices and records in one place, with no agency margin.</p></div>
      </div>
    </div>
    <div style="margin-top: 40px; border: 1px solid #DCE6D6; border-radius: 14px; padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: center; justify-content: space-between">
      <p style="margin: 0; max-width: 760px"><strong>How it's priced.</strong> [CONFIRM: is booking free for private providers as it is for NHS practices, or is there a partnership fee?]</p>
      <a href="#talk" style="font-weight: 600">Talk to us about cover</a>
    </div>
  </section>

  <!-- Commercial -->
  <section id="commercial" style="background: #0B1F33; color: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
      <p style="margin: 0 0 12px; font-weight: 700; font-size: 15px; color: #F2765A">Commercial partners</p>
      <h2 style="margin: 0 0 16px; font-weight: 800; font-size: 44px; line-height: 1.08; letter-spacing: -0.02em; max-width: 820px">Reach sessional GPs through an organisation they trust.</h2>
      <p style="margin: 0 0 40px; color: #D6DEE8; font-size: 19px; max-width: 720px">We partner with a small number of organisations whose products genuinely help sessional GPs. Every partner is chosen for members, not for reach.</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px">
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Member offers</h3><p style="margin: 0; color: #D6DEE8">Exclusive discounts on indemnity, accountancy, insurance, and equipment, shown in the member Resource Hub.</p></div>
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Webinars and content</h3><p style="margin: 0; color: #D6DEE8">Expert sessions and guides co-created with NASGP, on topics members actually ask about.</p></div>
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Newsletter and events</h3><p style="margin: 0; color: #D6DEE8">A clearly labelled place in the member newsletter and at NASGP events. [CONFIRM sponsorship options]</p></div>
      </div>
      <div style="margin-top: 48px">
        <p style="margin: 0 0 16px; font-size: 15px; color: #D6DEE8">Current partners</p>
        <div style="display: flex; flex-wrap: wrap; gap: 14px">
          <span style="border: 1px dashed #56687F; border-radius: 10px; padding: 18px 28px; color: #D6DEE8">[Partner logo]</span>
          <span style="border: 1px dashed #56687F; border-radius: 10px; padding: 18px 28px; color: #D6DEE8">[Partner logo]</span>
          <span style="border: 1px dashed #56687F; border-radius: 10px; padding: 18px 28px; color: #D6DEE8">[Partner logo]</span>
          <span style="border: 1px dashed #56687F; border-radius: 10px; padding: 18px 28px; color: #D6DEE8">[Partner logo]</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Enquiry -->
  <section id="talk" style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <div style="display: flex; flex-wrap: wrap; gap: 40px 72px">
      <div style="flex: 1 1 360px; min-width: 0">
        <h2 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1.08; letter-spacing: -0.02em">Start a conversation</h2>
        <p style="margin: 14px 0 0; color: #3A4F6B">Tell us a little about your organisation and our partnerships team will come back to you within [2] working days.</p>
        <p style="margin: 20px 0 0; color: #3A4F6B">Working with an ICB or PCN? <a href="icbs.html" style="font-weight: 600">See NHS partnerships</a></p>
      </div>
      <form style="flex: 1 1 520px; min-width: 0; background: #EEF6E8; border-radius: 14px; padding: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; align-content: start">
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="p-name" style="font-weight: 600; font-size: 15px">Name</label><input id="p-name" type="text" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="p-email" style="font-weight: 600; font-size: 15px">Work email</label><input id="p-email" type="email" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="p-org" style="font-weight: 600; font-size: 15px">Organisation</label><input id="p-org" type="text" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="p-type" style="font-weight: 600; font-size: 15px">I'm interested in</label><select id="p-type" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF"><option>Booking GPs for private practice</option><option>Out-of-hours or urgent care cover</option><option>A member offer or commercial partnership</option><option>Something else</option></select></div>
        <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px"><label for="p-msg" style="font-weight: 600; font-size: 15px">What are you looking for?</label><textarea id="p-msg" rows="4" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px; background: #FFFFFF; resize: vertical"></textarea></div>
        <button type="button" style="justify-self: start; font: inherit; font-weight: 700; background: #0B1F33; color: #FFFFFF; border: 0; padding: 16px 26px; border-radius: 6px; cursor: pointer">Send enquiry</button>
      </form>
    </div>
  </section>

  <footer style="background: #0B1F33; color: #D6DEE8; font-size: 15px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; color: #FFFFFF">nasgp</span>
      <span style="display: flex; flex-wrap: wrap; gap: 8px 24px"><a href="about.html" style="color: #D6DEE8">About</a>
        <a href="members-hub.html" style="color: #0B1F33; text-decoration: none">Members</a><a href="help.html" style="color: #D6DEE8">Help</a><a href="contact.html" style="color: #D6DEE8">Contact</a><span>© 2026 NASGP</span></span>
    </div>
  </footer>
</div>
</script>
