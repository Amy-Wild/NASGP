        <p style="margin: 24px 0 0; font-size: 20px; max-width: 560px; color: #33475B">Thirty years of collective voice, practical support and fighting your corner. NASGP is independent, run by GPs who do sessional work, and not on the side of any agency or employer.</p>

  <!-- What members get -->

        <div style="background: #FFFFFF; border: 1px solid #DCE6D6; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 14px">

          </div>
          <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.25">Collective voice</h3>
          <p style="margin: 0; color: #33475B; line-height: 1.6">NASGP campaigns for sessional GPs at national level on pay, pensions, working conditions and workforce planning. When sessional GPs speak through NASGP, they are heard.</p>
          <a href="campaigns.html" style="margin-top: auto; padding-top: 8px; font-weight: 600; font-size: 15px; color: #2F6B22; text-decoration: none">Campaigns and wins →</a>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #DCE6D6; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 14px">
          <div style="width: 44px; height: 44px; background: #EEF6E8; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4FA83D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          </div>
          <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.25">Support when things get complicated</h3>
          <p style="margin: 0; color: #33475B; line-height: 1.6">A difficult practice, a disputed invoice, a complaint: NASGP has people who know sessional work and can help you navigate it. Not a helpline. People.</p>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #DCE6D6; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 14px">
          <div style="width: 44px; height: 44px; background: #EEF6E8; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4FA83D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          </div>
          <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.25">Academy: accredited learning</h3>
          <p style="margin: 0; color: #33475B; line-height: 1.6">CPD and appraisal support built around the reality of sessional work, not designed for salaried GPs and adapted later.</p>
          <a href="academy.html" style="margin-top: auto; padding-top: 8px; font-weight: 600; font-size: 15px; color: #2F6B22; text-decoration: none">Explore the Academy →</a>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #DCE6D6; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 14px">
          <div style="width: 44px; height: 44px; background: #EEF6E8; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4FA83D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </div>
          <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.25">Locum Chambers</h3>
          <p style="margin: 0; color: #33475B; line-height: 1.6">A local peer group of sessional GPs. Regular meetings, shared learning and someone to call when a clinical question needs talking through.</p>
          <a href="chambers.html" style="margin-top: auto; padding-top: 8px; font-weight: 600; font-size: 15px; color: #2F6B22; text-decoration: none">About Chambers →</a>
        </div>

          <a href="community.html" style="margin-top: auto; padding-top: 8px; font-weight: 600; font-size: 15px; color: #2F6B22; text-decoration: none">Member community →</a>

            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>

        <div style="background: #E2F2DA; color: #0B1F33; border-radius: 14px; padding: 40px; display: flex; flex-direction: column; gap: 18px">

            <div style="display: flex; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span>See availability, credentials and terms before you book</span></div>

  <!-- Proof of voice: Campaigns and wins -->

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px">
