        <p style="margin: 0 0 16px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #F2765A">For ICBs, PCNs and federations</p>
        <h1 style="margin: 0; font-weight: 800; font-size: 60px; line-height: 1.04; letter-spacing: -0.025em">Your sessional GPs are already there. Make them <span style="position: relative; display: inline-block; white-space: nowrap">part of the plan.<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span></h1>
        <p style="margin: 24px 0 0; font-size: 20px; max-width: 620px; color: #D6DEE8">An NASGP partnership gives local GPs fully funded access to LocumDeck, gives practices a free way to book them, and gives you live data on where capacity sits. Less agency spend, fewer gaps.</p>

  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <h2 style="margin: 0 0 48px; font-weight: 800; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em; max-width: 760px">What a partnership includes</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px">
      <div style="background: #E2F2DA; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 10px">
        <h3 style="margin: 0; font-size: 22px; font-weight: 700">Funded GP membership</h3>
        <p style="margin: 0; color: #2A4566">Sessional GPs working in your area use LocumDeck free, with booking fees covered. It removes the reason not to sign up.</p>
      </div>
      <div style="background: #DDEAF4; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 10px">
        <h3 style="margin: 0; font-size: 22px; font-weight: 700">Free booking for practices</h3>
        <p style="margin: 0; color: #2A4566">Every practice in your footprint can book in person or remote GPs directly, with compliance checked up front.</p>
      </div>
      <div style="background: #FCE3DA; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 10px">
        <h3 style="margin: 0; font-size: 22px; font-weight: 700">Workforce data and intelligence</h3>
        <p style="margin: 0; color: #2A4566">Sessions completed, hours worked, advance booking rates, unused capacity and average hourly rates, across your area. NASGP likely holds one of the most complete datasets on GP sessional work and work patterns in England.</p>
        <p style="margin: 8px 0 0; color: #2A4566; font-size: 15px"><strong>All workforce data is anonymised.</strong> No member's personal data or individual records are shared with any commissioner or third party.</p>
      </div>
      <div style="background: #EDE6F5; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 10px">
        <h3 style="margin: 0; font-size: 22px; font-weight: 700">Local chambers</h3>
        <p style="margin: 0; color: #2A4566">A peer support group for your sessional GPs, so they stay, stay well and stay local.</p>
      </div>
    </div>
  </section>

  <!-- Supporting neighbourhood health -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 0 24px 96px">

        <p style="margin: 18px 0 0; color: #3A4F6B; font-size: 19px">Sessional GPs who work across multiple practices are well placed for neighbourhood health. They know several sites, can flex across a network and bring consistency without being tied to one list. NASGP keeps them well-supported, well-trained and well-connected.</p>
        <p style="margin: 14px 0 0; color: #3A4F6B; font-size: 19px">If you are working on neighbourhood health planning and want to understand how a visible sessional GP workforce fits in, we would like to talk.</p>
        <a href="contact.html" style="display: inline-block; margin-top: 24px; background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 16px 24px; border-radius: 6px; font-weight: 600">Start a conversation</a>

        <p style="margin: 0; color: #33475B">NASGP does not commodify the workforce  it looks after it. Members have access to the Academy, chambers, peer support and guidance when things get complicated. A GP who is well-supported and well-trained delivers better care. That matters as much to commissioners as it does to members.</p>
      </div>
    </div>
