<body>

<div style="font-family: 'Inter', system-ui, sans-serif; color: #0B1F33; background: #FFFFFF; font-size: 17px; line-height: 1.55">

  <div style="background: #0B1F33; color: #FFFFFF; font-size: 14px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center">
      <span>The independent membership body for sessional GPs, since 1997</span>
      <div style="display: flex; flex-wrap: wrap; gap: 20px">
        <a href="#" style="color: #FFFFFF; text-decoration: none">Practices: sign in or register</a>
        <a href="#" style="color: #FFFFFF; text-decoration: none; font-weight: 700">Go to LocumDeck</a>
      </div>
    </div>
  </div>
  <header style="border-bottom: 1px solid #DCE6D6; background: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; text-decoration: none" aria-label="NASGP home">
        <span style="background: #4FA83D; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1; padding: 10px 16px 12px">nasgp</span>
        <span style="background: #0B1F33; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-size: 13px; line-height: 1.15; padding: 8px 12px; display: flex; align-items: center; max-width: 150px">National Association of Sessional GPs</span>
      </a>
      <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; font-weight: 500; font-size: 16px">
        <a href="gps.html" style="color: #0B1F33; text-decoration: none">For GPs</a>
        <a href="practices.html" style="color: #0B1F33; text-decoration: none">For practices</a>
        <a href="icbs.html" style="color: #0B1F33; text-decoration: none">For ICBs and PCNs</a>
        <a href="work-with-nasgp.html" style="color: #0B1F33; text-decoration: none">Work with NASGP</a>
        <a href="locumdeck.html" style="color: #0B1F33; text-decoration: none">LocumDeck</a>
        <a href="news.html" style="color: #0B1F33; text-decoration: underline; text-decoration-color: #4FA83D; text-decoration-thickness: 3px; text-underline-offset: 8px">News and guides</a>
        <a href="about.html" style="color: #0B1F33; text-decoration: none">About</a>
        <a href="members-hub.html" style="color: #0B1F33; text-decoration: none">Members</a>
        <a href="join.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: 600">Join free</a>
      </nav>
    </div>

  <section style="max-width: 1240px; margin: 0 auto; padding: 72px 24px 40px">
    <h1 style="margin: 0; font-weight: 800; font-size: 56px; line-height: 1.05; letter-spacing: -0.025em">News and <span style="position: relative; display: inline-block; white-space: nowrap">guides<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span></h1>
    <p style="margin: 16px 0 0; font-size: 19px; color: #3A4F6B; max-width: 640px">Practical help on pensions, tax, rates and work, plus what's changing in general practice. Written for sessional GPs and the practices that book them.</p>

    <!-- Featured -->
    <a href="article.html" style="margin-top: 48px; display: flex; flex-wrap: wrap; border-radius: 14px; overflow: hidden; text-decoration: none; color: #0B1F33; background: #EEF6E8">
      <div style="flex: 1 1 460px; min-height: 300px; background: #E2F2DA; display: flex; align-items: end; padding: 28px; box-sizing: border-box">
        <span style="background: #FFFFFF; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 99px">LocumDeck</span>
      </div>
      <div style="flex: 1 1 460px; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; justify-content: center">
        <span style="font-size: 14px; font-weight: 600; color: #2F6B22">Featured</span>
        <h2 style="margin: 0; font-weight: 800; font-size: 36px; line-height: 1.12; letter-spacing: -0.02em">GPs see year on year growth on LocumDeck amid scarcity concerns</h2>
        <p style="margin: 0; color: #3A4F6B">Sessions and hours worked are up in NASGP's regional ICB partnerships, even as headlines warn of falling locum work.</p>
        <span style="font-size: 14px; color: #56687F">News · 6 June 2024 · 3 min read</span>
      </div>
    </a>
  </section>

  <!-- Filters -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 16px 24px 96px">
    <div role="group" aria-label="Filter by topic" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px">
      <template data-kind="for" list="{{topics}}" as="t" hint-placeholder-count="6">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.active}}" style="font: inherit; font-size: 15px; font-weight: 600; padding: 10px 18px; border-radius: 99px; cursor: pointer; border: {{t.border}}; background: {{t.bg}}; color: {{t.color}}">{{t.name}}</button>
      </template>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px">
      <template data-kind="for" list="{{shown}}" as="a" hint-placeholder-count="6">
        <a href="article.html" style="display: flex; flex-direction: column; border: 1px solid #DCE6D6; border-radius: 14px; overflow: hidden; text-decoration: none; color: #0B1F33">
          <div style="height: 160px; background: {{a.tint}}; display: flex; align-items: end; padding: 16px; box-sizing: border-box"><span style="background: #FFFFFF; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 99px">{{a.topic}}</span></div>
          <div style="padding: 24px; display: flex; flex-direction: column; gap: 10px; flex: 1">
            <h3 style="margin: 0; font-weight: 700; font-size: 21px; line-height: 1.25; letter-spacing: -0.01em">{{a.title}}</h3>
            <span style="margin-top: auto; font-size: 14px; color: #56687F">{{a.meta}}</span>
          </div>
        </a>
      </template>
    </div>
  </section>

  <!-- Magazine + podcast -->
  <section style="background: #0B1F33; color: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 72px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px">
      <div style="border: 1px solid #2F4E78; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 10px"><span style="color: #F2765A; font-weight: 600; font-size: 14px">Magazine</span><h2 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">The Sessional GP</h2><p style="margin: 0; color: #D6DEE8">NASGP's magazine for sessional GPs. [Latest issue]</p><a href="#" style="color: #FFFFFF; font-weight: 600">Read the latest issue</a></div>
      <div style="border: 1px solid #2F4E78; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 10px"><span style="color: #F2765A; font-weight: 600; font-size: 14px">Podcast</span><h2 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">The NASGP podcast</h2><p style="margin: 0; color: #D6DEE8">Conversations with GPs about the working life nobody trained them for. [Latest episode]</p><a href="#" style="color: #FFFFFF; font-weight: 600">Listen now</a></div>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 80px 24px">
    <div style="display: flex; flex-wrap: wrap; gap: 32px 64px; align-items: center">
      <div style="flex: 1 1 420px; min-width: 0">
        <h2 style="margin: 0; font-weight: 800; font-size: 36px; line-height: 1.1; letter-spacing: -0.02em">Get these in your inbox</h2>
        <p style="margin: 12px 0 0; color: #3A4F6B">Free, fortnightly, easy to leave. No membership needed.</p>
      </div>
      <form style="flex: 1 1 420px; min-width: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: end">
        <div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 6px"><label for="n-email" style="font-weight: 600; font-size: 15px">Email address</label><input id="n-email" type="email" style="font: inherit; padding: 14px 16px; border: 1px solid #8A97A3; border-radius: 6px"></div>
        <button type="button" style="font: inherit; font-weight: 600; background: #0B1F33; color: #FFFFFF; border: 0; padding: 15px 24px; border-radius: 6px; cursor: pointer">Subscribe</button>
      </form>
    </div>
  </section>

  <footer style="background: #0B1F33; color: #D6DEE8; font-size: 15px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; color: #FFFFFF">nasgp</span>
      <span style="display: flex; flex-wrap: wrap; gap: 8px 24px"><a href="about.html" style="color: #D6DEE8">About</a>
        <a href="members-hub.html" style="color: #0B1F33; text-decoration: none">Members</a><a href="help.html" style="color: #D6DEE8">Help</a><a href="contact.html" style="color: #D6DEE8">Contact</a><span>© 2026 NASGP</span></span>
    </div>
  </footer>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3400}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { topic: 'All' }; }
  renderVals() {
    const tint = { 'LocumDeck': '#E2F2DA', 'Money and pensions': '#DDEAF4', 'For practices': '#FCE3DA', 'Wellbeing': '#F7EAD9', 'Learning': '#EDE6F5' };
    const articles = [
      { topic: 'LocumDeck', title: 'NASGP’s LocumDeck added to NHS national framework', meta: 'News · Nov 2022' },
      { topic: 'Money and pensions', title: '[Making Tax Digital: what sessional GPs need to do this quarter]', meta: 'Guide · [Date]' },
      { topic: 'For practices', title: '[Winter cover and the GP access funding change]', meta: 'Guide · [Date]' },
      { topic: 'Wellbeing', title: '[Always coping? Knowing when to step back]', meta: 'Opinion · [Date]' },
      { topic: 'Learning', title: '[Appraisal made simpler: templates for sessional GPs]', meta: 'Guide · [Date]' },
      { topic: 'For practices', title: 'All Gloucestershire GP practices now on LocumDeck', meta: 'News · Aug 2022' },
      { topic: 'Money and pensions', title: '[NHS pensions for locums: Locum A and B forms explained]', meta: 'Guide · [Date]' },
      { topic: 'LocumDeck', title: '[How remote sessions work on LocumDeck]', meta: 'Guide · [Date]' },
      { topic: 'Learning', title: '[Locum Academy: what’s on this term]', meta: 'Events · [Date]' }
    ].map((a) => ({ ...a, tint: tint[a.topic] }));
    const names = ['All', 'LocumDeck', 'Money and pensions', 'For practices', 'Wellbeing', 'Learning'];
    const topics = names.map((n) => {
      const active = this.state.topic === n;
      return { name: n, active, bg: active ? '#0B1F33' : (tint[n] || '#FFFFFF'), color: active ? '#FFFFFF' : '#0B1F33', border: active ? '1px solid #0B1F33' : '1px solid #DCE6D6', pick: () => this.setState({ topic: n }) };
    });
    const shown = this.state.topic === 'All' ? articles : articles.filter((a) => a.topic === this.state.topic);
    return { topics, shown };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
