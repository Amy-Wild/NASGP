      <h1 style="margin: 0; font-weight: 800; font-size: 52px; line-height: 1.08; letter-spacing: -0.025em">GPs see year on year growth on LocumDeck amid scarcity concerns</h1>
      <p style="margin: 20px 0 0; font-size: 21px; color: #2A4566">Sessions and hours worked are up in NASGP's regional ICB partnerships, even as headlines warn of falling locum work.</p>
      <div style="margin-top: 28px; display: flex; gap: 14px; align-items: center">
        <span style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">N</span>

      <p style="margin: 0 0 24px">GPs working in NASGP's seven regional ICB partnerships worked 15% more sessions year on year, according to LocumDeck data.</p>
      <p style="margin: 0 0 24px">Comparing May 2024 with May 2023, GPs worked 14.5% more sessions and 16% more hours in the partnership areas. The number of practices registered on LocumDeck in those areas grew by 20% over the same period.</p>
      <h2 style="margin: 40px 0 16px; font-weight: 800; font-size: 30px; line-height: 1.2; letter-spacing: -0.02em">A different picture from the headlines</h2>
      <p style="margin: 0 0 24px">The figures come as industry titles and the BMA raise concerns about the availability of sessional GP work. Some have pointed to funding. NASGP's view is that a rise in GP locums over the last five years has also increased competition for sessions.</p>
      <blockquote style="margin: 32px 0; padding: 4px 0 4px 24px; border-left: 4px solid #4FA83D; font-size: 24px; line-height: 1.45; font-weight: 600">“In areas where LocumDeck has been adopted widely by GP locums and practices, the use of GP locums to support practices is higher than ever.”<span style="display: block; margin-top: 12px; font-size: 16px; font-weight: 500; color: #3A4F6B">Dr Richard Fieldhouse, NASGP chair</span></blockquote>
      <p style="margin: 0 0 24px">NASGP works with ICBs in Suffolk, Hertfordshire, Essex, Gloucestershire, Buckinghamshire, Oxfordshire, West Berkshire and Frimley to support local GPs and practices.</p>
