        <a href="#" style="color: #FFFFFF; text-decoration: none; font-weight: 700">Go to LocumDeck</a>
      </div>

  <header style="border-bottom: 1px solid #DCE6D6; background: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; text-decoration: none" aria-label="NASGP home">
        <span style="background: #4FA83D; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1; padding: 10px 16px 12px">nasgp</span>
        <span style="background: #0B1F33; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-size: 13px; line-height: 1.15; padding: 8px 12px; display: flex; align-items: center; max-width: 150px">National Association of Sessional GPs</span>

  </header>

  <section style="background: #EDE6F5">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; gap: 48px 64px; align-items: center">
      <div style="flex: 1 1 600px; min-width: 0">
        <p style="margin: 0 0 16px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase"><a href="gps.html" style="text-decoration: none">For GPs</a> / Locum Chambers</p>
        <h1 style="margin: 0; font-weight: 800; font-size: 62px; line-height: 1.03; letter-spacing: -0.025em">Locuming, without <span style="position: relative; display: inline-block; white-space: nowrap">going it alone.<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span></h1>
        <p style="margin: 24px 0 0; font-size: 20px; max-width: 600px; color: #2A4566">A Locum Chambers is a local group of sessional GPs who meet, share and back each other up, with NASGP handling the admin. Like barristers' chambers, but for general practice.</p>
        <div style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 16px">
          <a href="join.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 18px 26px; border-radius: 6px; font-weight: 600">Join a chambers</a>
          <a href="membership.html" style="font-weight: 600; padding: 18px 4px">Compare all plans</a>
        </div>
      </div>
      <div style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-weight: 600; color: #2F6B22">Chambers membership</span>
        <div><span style="font-weight: 800; font-size: 56px; letter-spacing: -0.03em">£45</span><span style="color: #56687F"> a month</span></div>
        <span style="font-weight: 600">£11 per booked day, instead of £15</span>
        <p style="margin: 4px 0 0; color: #3A4F6B; font-size: 15px">Pays for itself if you book about five or more days a month. All fees tax-deductible.</p>
      </div>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <h2 style="margin: 0 0 48px; font-weight: 800; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em; max-width: 720px">What you get as a chambers member</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px 32px">
      <div style="border-top: 3px solid #F2765A; padding-top: 20px"><h3 style="margin: 0 0 8px; font-size: 21px">Private webinars</h3><p style="margin: 0; color: #3A4F6B">Small members-only sessions every [month] with GPs, accountants and pension specialists. Every recording saved in your <a href="resource-hub.html">Resource Hub</a>. <a href="events.html">See what's coming up</a>.</p></div>
      <div style="border-top: 3px solid #4FA83D; padding-top: 20px"><h3 style="margin: 0 0 8px; font-size: 21px">A peer group nearby</h3><p style="margin: 0; color: #3A4F6B">Regular meetings with sessional GPs in your area. Learning, case discussion and someone to call after a hard day.</p></div>
      <div style="border-top: 3px solid #4FA83D; padding-top: 20px"><h3 style="margin: 0 0 8px; font-size: 21px">Admin support</h3><p style="margin: 0; color: #3A4F6B">Dedicated onboarding and ongoing help with bookings, invoices and anything that gets stuck.</p></div>
      <div style="border-top: 3px solid #4FA83D; padding-top: 20px"><h3 style="margin: 0 0 8px; font-size: 21px">Priority advice</h3><p style="margin: 0; color: #3A4F6B">Faster access to expert guidance on pensions, contracts, tax and difficult situations.</p></div>
      <div style="border-top: 3px solid #4FA83D; padding-top: 20px"><h3 style="margin: 0 0 8px; font-size: 21px">Lower booking fee</h3><p style="margin: 0; color: #3A4F6B">£11 a booked day instead of £15, plus everything in Professional Plus.</p></div>
    </div>
  </section>

  <section style="background: #EEF6E8">
    <div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
      <h2 style="margin: 0 0 12px; font-weight: 800; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em">Chambers near you</h2>
      <p style="margin: 0 0 40px; color: #3A4F6B">Chambers run where NASGP partners with local ICBs and GP groups. Can't see yours? Tell us, and we'll let you know when one opens.</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
        <template data-kind="for" list="{{chambers}}" as="c" hint-placeholder-count="4">
          <div style="background: #FFFFFF; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 6px">
            <strong style="font-size: 19px">{{c.name}}</strong>
            <span style="font-size: 15px; color: #56687F">{{c.detail}}</span>
          </div>
        </template>
      </div>
      <a href="contact.html" style="display: inline-block; margin-top: 28px; font-weight: 600">Register interest for your area</a>

  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 48px">

    </figure>
    <figure style="margin: 0">

      <div style="flex: 1 1 520px; min-width: 0">

        <p style="margin: 12px 0 0; color: #D6DEE8">Switch to chambers from your LocumDeck account. The lower booking fee applies from your next booking.</p>
