    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px 72px">
      <p style="margin: 0 0 16px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #2F6B22">Campaigns and wins</p>
      <h1 style="margin: 0; font-weight: 800; font-size: 60px; line-height: 1.04; letter-spacing: -0.025em; max-width: 820px">Thirty years of fighting in your <span style="position: relative; display: inline-block; white-space: nowrap">corner.<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span></h1>
      <p style="margin: 24px 0 0; font-size: 20px; max-width: 680px; color: #3A4F6B">Sessional GPs have been invisible to NHS planners and underrepresented in policy decisions for too long. NASGP campaigns at national level for fair pay, proper recognition and the conditions to make sessional work sustainable.</p>
    </div>
  </section>

  <!-- Headline win -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <h2 style="margin: 0 0 48px; font-weight: 800; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em">The wins</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px">
      <div style="background: #EEF6E8; border-radius: 14px; padding: 40px; display: flex; flex-direction: column; gap: 14px">
        <p style="margin: 0; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #2F6B22">Landmark win</p>
        <h3 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">NHS Pension access for GP locums</h3>
        <p style="margin: 0; color: #33475B; font-size: 18px; line-height: 1.55">For years, GP locums were excluded from the NHS Pension Scheme in a way that salaried colleagues were not. NASGP campaigned consistently and persistently for that to change. It did. GP locums can now access the NHS Pension on fair terms. LocumDeck automates the Locum A and B forms so the pension is claimed without extra admin.</p>
        <p style="margin: 4px 0 0; color: #33475B">This is the credibility no agency or booking platform can copy. It took thirty years of independent advocacy.</p>
      </div>
      <div style="border: 1px solid #DCE6D6; border-radius: 14px; padding: 40px; display: flex; flex-direction: column; gap: 14px">
        <p style="margin: 0; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #1E4A70">Ongoing</p>
        <h3 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Fair rates and workforce recognition</h3>
        <p style="margin: 0; color: #33475B; font-size: 18px; line-height: 1.55">Sessional GPs are often invisible to NHS workforce planners — scattered across agencies, platforms and WhatsApp groups, without a unified voice. NASGP makes them visible: publishing data, advocating in national consultations and pushing back when sessional work is undervalued or excluded from planning.</p>
      </div>
      <div style="border: 1px dashed #DCE6D6; border-radius: 14px; padding: 40px; background: #FAFBF9; display: flex; flex-direction: column; gap: 14px">
        <p style="margin: 0; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #56687F">[Add campaign or win]</p>
        <h3 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2; color: #56687F">[Campaign title]</h3>
        <p style="margin: 0; color: #56687F; font-size: 18px; line-height: 1.55">[Brief description]</p>
      </div>
    </div>
  </section>

  <!-- What collective voice means -->
  <section style="background: #0B1F33; color: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
      <h2 style="margin: 0 0 16px; font-weight: 800; font-size: 44px; line-height: 1.08; letter-spacing: -0.02em; max-width: 820px">What the collective voice does</h2>
      <p style="margin: 0 0 48px; color: #D6DEE8; font-size: 19px; max-width: 720px">Every NASGP member adds to a workforce that is visible, counted and represented. That visibility has practical value — it brings more work, better conditions and policy decisions that don't overlook sessional GPs.</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px 32px">
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px">
          <h3 style="margin: 0 0 8px; font-size: 21px">Data that shows you exist</h3>
          <p style="margin: 0; color: #D6DEE8">NASGP likely holds one of the most complete datasets on GP sessional work in England. When this is used in consultations, it is anonymised data representing the workforce — not personal records.</p>
        </div>
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px">
          <h3 style="margin: 0 0 8px; font-size: 21px">Representation in national conversations</h3>
          <p style="margin: 0; color: #D6DEE8">NASGP responds to NHS England consultations, works with LMCs and the BMA, and raises sessional GP issues where they would otherwise be ignored.</p>
        </div>
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px">
          <h3 style="margin: 0 0 8px; font-size: 21px">Independence that matters</h3>
          <p style="margin: 0; color: #D6DEE8">NASGP is not owned by an agency, an insurer or any other commercial interest. Its campaigns serve members, not shareholders.</p>
        </div>
      </div>
    </div>
  </section>
