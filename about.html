<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>About NASGP | NASGP preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0B1F33}a:hover{color:#2F6B22}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-template" id="dc-tpl">

<div style="font-family: 'Inter', system-ui, sans-serif; color: #0B1F33; background: #FFFFFF; font-size: 17px; line-height: 1.55">

  <div style="background: #0B1F33; color: #FFFFFF; font-size: 14px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center">
      <span>The independent membership body for sessional GPs, since 1997</span>
      <div style="display: flex; flex-wrap: wrap; gap: 20px">
        <a href="#" style="color: #FFFFFF; text-decoration: none">Practices: sign in or register</a>
        <a href="#" style="color: #FFFFFF; text-decoration: none; font-weight: 700">Go to LocumDeck</a>
      </div>
    </div>
  </div>
  <header style="border-bottom: 1px solid #DCE6D6; background: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; text-decoration: none" aria-label="NASGP home">
        <span style="background: #4FA83D; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1; padding: 10px 16px 12px">nasgp</span>
        <span style="background: #0B1F33; color: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-size: 13px; line-height: 1.15; padding: 8px 12px; display: flex; align-items: center; max-width: 150px">National Association of Sessional GPs</span>
      </a>
      <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; font-weight: 500; font-size: 16px">
        <a href="gps.html" style="color: #0B1F33; text-decoration: none">For GPs</a>
        <a href="practices.html" style="color: #0B1F33; text-decoration: none">For practices</a>
        <a href="icbs.html" style="color: #0B1F33; text-decoration: none">For ICBs and PCNs</a>
        <a href="locumdeck.html" style="color: #0B1F33; text-decoration: none">LocumDeck</a>
        <a href="news.html" style="color: #0B1F33; text-decoration: none">News and guides</a>
        <a href="about.html" style="color: #0B1F33; text-decoration: underline; text-decoration-color: #4FA83D; text-decoration-thickness: 3px; text-underline-offset: 8px">About</a>
        <a href="join.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: 600">Join free</a>
      </nav>
    </div>
  </header>

  <section style="background: #EEF6E8">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; gap: 40px 72px; align-items: end">
      <div style="flex: 1 1 640px; min-width: 0">
        <p style="margin: 0 0 16px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #2F6B22">About NASGP</p>
        <h1 style="margin: 0; font-weight: 800; font-size: 62px; line-height: 1.03; letter-spacing: -0.025em">Started by <span style="position: relative; display: inline-block; white-space: nowrap">two GPs<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span> in 1997. Still on the side of sessional GPs.</h1>
      </div>
      <p style="flex: 1 1 380px; min-width: 0; margin: 0; font-size: 20px; color: #3A4F6B">NASGP is the independent membership body for sessional GPs and clinicians. Not an agency, not a recruitment firm. We exist to help GPs who work flexibly do it well, and to help practices and the NHS make the most of them.</p>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; gap: 48px 72px">
    <div style="flex: 1 1 420px; min-width: 0">
      <h2 style="margin: 0 0 20px; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em">Our story</h2>
      <p style="margin: 0 0 18px; color: #3A4F6B">Dr Richard Fieldhouse and Dr Sara Chambers founded NASGP in 1997, when sessional GPs had no voice and very little support. [One or two sentences on why they started it.]</p>
      <p style="margin: 0; color: #3A4F6B">That became LocumDeck: a platform designed by GP locums, so GPs can work as independent professionals on their own terms rather than as a commodity.</p>
    </div>
    <div style="flex: 1 1 520px; min-width: 0">
      <template data-kind="for" list="{{timeline}}" as="t" hint-placeholder-count="6">
        <div style="display: flex; gap: 24px; padding: 18px 0; border-top: 1px solid #DCE6D6">
          <strong style="flex: 0 0 72px; font-size: 22px; font-weight: 800">{{t.year}}</strong>
          <span style="color: #3A4F6B">{{t.text}}</span>
        </div>
      </template>
    </div>
  </section>

  <section style="background: #0B1F33; color: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px">
      <h2 style="margin: 0 0 40px; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em">What we believe</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px">
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Sessional GPs are the workforce</h3><p style="margin: 0; color: #D6DEE8">Not gap-fillers. A planned, valued part of general practice.</p></div>
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Direct beats middlemen</h3><p style="margin: 0; color: #D6DEE8">GPs and practices should work together without margins taken in between.</p></div>
        <div style="border-top: 3px solid #4FA83D; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Nobody should go it alone</h3><p style="margin: 0; color: #D6DEE8">Peer support, chambers and good advice make flexible work sustainable.</p></div>
      </div>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <h2 style="margin: 0 0 40px; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em">The team</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px">
      <template data-kind="for" list="{{team}}" as="p" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div style="aspect-ratio: 1 / 1; border-radius: 14px; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; color: #56687F; font-size: 14px">[Photo]</div>
          <strong style="font-size: 18px">{{p.name}}</strong>
          <span style="font-size: 15px; color: #56687F; margin-top: -6px">{{p.role}}</span>
        </div>
      </template>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 0 24px 96px">
    <div style="background: #EEF6E8; border-radius: 14px; padding: 40px; display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center; justify-content: space-between">
      <div style="flex: 1 1 520px; min-width: 0"><h2 style="margin: 0; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">Partners and press</h2><p style="margin: 8px 0 0; color: #3A4F6B">Working with ICBs, LMCs, training hubs and suppliers across England. Journalists can reach us on the contact page.</p></div>
      <a href="contact.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 16px 24px; border-radius: 6px; font-weight: 600">Get in touch</a>
    </div>
  </section>

  <footer style="background: #0B1F33; color: #D6DEE8; font-size: 15px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; color: #FFFFFF">nasgp</span>
      <span style="display: flex; flex-wrap: wrap; gap: 8px 24px"><a href="help.html" style="color: #D6DEE8">Help</a><a href="contact.html" style="color: #D6DEE8">Contact</a><span>© 2026 NASGP · Registered in England 03861212</span></span>
    </div>
  </footer>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      timeline: [
        { year: '1997', text: 'NASGP founded by Dr Richard Fieldhouse and Dr Sara Chambers.' },
        { year: '[Year]', text: 'LocumDeck launched. [CONFIRM]' },
        { year: '2021', text: 'LocumDeck opens to nurses, nursing associates and healthcare assistants. First Locum Chambers runs in North East Essex.' },
        { year: '2022', text: 'LocumDeck becomes a registered NHS digital supplier. All Gloucestershire practices sign up.' },
        { year: '2023', text: 'Practice administrators and receptionists join the platform. Chambers opens to Suffolk GPs.' },
        { year: '2026', text: '[This year’s milestone]' }
      ],
      team: [
        { name: 'Dr Richard Fieldhouse', role: 'Chair and co-founder', tint: '#E2F2DA' },
        { name: '[Name]', role: 'Membership support lead', tint: '#DDEAF4' },
        { name: '[Name]', role: 'Practice sessions and ambassadors', tint: '#FCE3DA' },
        { name: '[Name]', role: 'Business development', tint: '#EDE6F5' }
      ]
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
