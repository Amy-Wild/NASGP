      </div>

  <section style="background: #F7EAD9">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px">
      <p style="margin: 0 0 16px; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase"><a href="gps.html" style="text-decoration: none">For GPs</a> / Work on your terms</p>
      <h1 style="margin: 0; font-weight: 800; font-size: 60px; line-height: 1.04; letter-spacing: -0.025em; max-width: 960px">You left the treadmill for a reason. Don't hand it back <span style="position: relative; display: inline-block; white-space: nowrap">one extra patient<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -0.14em; width: 100%; height: 0.24em; overflow: visible"><path d="M3 8.5 C 55 3.5, 130 2.5, 197 6" fill="none" stroke="#F2765A" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span> at a time.</h1>
      <p style="margin: 24px 0 0; font-size: 20px; max-width: 700px; color: #2A4566">Surprise duty cover. Extra appointments squeezed in. A home visit at 6pm. On LocumDeck your limits are written into the booking before a practice can confirm it. No awkward conversation on the day.</p>
      <a href="#builder" style="display: inline-block; margin-top: 32px; background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 18px 26px; border-radius: 6px; font-weight: 600">See how your terms look</a>
    </div>
  </section>

  <!-- Builder -->
  <section id="builder" style="max-width: 1240px; margin: 0 auto; padding: 88px 24px">
    <h2 style="margin: 0 0 12px; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em">Set it once. Every practice sees it before they book.</h2>
    <p style="margin: 0 0 40px; color: #3A4F6B; max-width: 680px">Try it. Change your limits on the left and watch the terms a practice agrees to update on the right.</p>
    <div style="display: flex; flex-wrap: wrap; gap: 32px">
      <div style="flex: 1 1 420px; min-width: 0; background: #EEF6E8; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 26px">
        <div>
          <label for="pts" style="font-weight: 600">Maximum patients per session: <span style="font-size: 24px; font-weight: 800">{{patients}}</span></label>
          <input id="pts" type="range" min="10" max="20" value="{{patients}}" onChange="{{setPatients}}" style="width: 100%; height: 32px; margin-top: 8px">
        </div>
        <div>
          <span id="len-l" style="display: block; font-weight: 600; margin-bottom: 10px">Minimum appointment length</span>
          <div role="group" aria-labelledby="len-l" style="display: flex; flex-wrap: wrap; gap: 8px">
            <template data-kind="for" list="{{lengths}}" as="o" hint-placeholder-count="3">
              <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.active}}" style="font: inherit; font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 99px; cursor: pointer; border: 1px solid #0B1F33; background: {{o.bg}}; color: {{o.color}}">{{o.name}}</button>
            </template>
          </div>
        </div>
        <div>
          <span id="hv-l" style="display: block; font-weight: 600; margin-bottom: 10px">Home visits</span>
          <div role="group" aria-labelledby="hv-l" style="display: flex; flex-wrap: wrap; gap: 8px">
            <template data-kind="for" list="{{visits}}" as="o" hint-placeholder-count="3">
              <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.active}}" style="font: inherit; font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 99px; cursor: pointer; border: 1px solid #0B1F33; background: {{o.bg}}; color: {{o.color}}">{{o.name}}</button>
            </template>
          </div>
        </div>
        <div>
          <span id="dd-l" style="display: block; font-weight: 600; margin-bottom: 10px">Duty doctor cover</span>
          <div role="group" aria-labelledby="dd-l" style="display: flex; flex-wrap: wrap; gap: 8px">
            <template data-kind="for" list="{{duty}}" as="o" hint-placeholder-count="3">
              <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.active}}" style="font: inherit; font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 99px; cursor: pointer; border: 1px solid #0B1F33; background: {{o.bg}}; color: {{o.color}}">{{o.name}}</button>
            </template>
          </div>
        </div>
      </div>

      <div style="flex: 1 1 420px; min-width: 0; background: #FFFFFF; border-radius: 14px; box-shadow: 0 1px 2px rgba(11,31,51,.06), 0 18px 40px rgba(11,31,51,.12); overflow: hidden">
        <div style="background: #0B1F33; color: #FFFFFF; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; font-size: 14px"><strong>Booking request · Thu 4 Dec · AM</strong><span>[Practice name]</span></div>
        <div style="padding: 24px; display: flex; flex-direction: column; gap: 4px">
          <p style="margin: 0 0 12px; font-size: 15px; color: #56687F">The practice must accept these terms to confirm.</p>
          <template data-kind="for" list="{{terms}}" as="t" hint-placeholder-count="5">
            <div style="display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid #DCE6D6">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F6B22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px"><path d="M20 6 9 17l-5-5"></path></svg>
              <span><strong>{{t.k}}</strong> {{t.v}}</span>
            </div>
          </template>
          <div style="margin-top: 16px; display: flex; gap: 10px">
            <span style="flex: 1; text-align: center; background: #4FA83D; color: #0B1F33; padding: 12px; border-radius: 6px; font-weight: 700">Accept terms and book</span>
          </div>
        </div>

    </div>
    <p style="margin: 20px 0 0; font-size: 14px; color: #56687F">[CONFIRM which of these terms LocumDeck supports today, and how practices see them.]</p>

  <section style="background: #0B1F33; color: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px">
      <div style="border-top: 3px solid #F2765A; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">No conflict on the day</h3><p style="margin: 0; color: #D6DEE8">The practice agreed your limits when they booked. If they ask for more, you can point to what they signed up to.</p></div>
      <div style="border-top: 3px solid #F2765A; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Different terms for different places</h3><p style="margin: 0; color: #D6DEE8">Tailor terms per practice or per booking, so a practice you know well can have a different arrangement.</p></div>
      <div style="border-top: 3px solid #F2765A; padding-top: 18px"><h3 style="margin: 0 0 8px; font-size: 21px">Back-up when it goes wrong</h3><p style="margin: 0; color: #D6DEE8">Professional Plus and Chambers members can call on NASGP for advice if a practice pushes past what was agreed.</p></div>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 88px 24px">
    <div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: end; margin-bottom: 28px">
      <h2 style="margin: 0; font-weight: 800; font-size: 36px; letter-spacing: -0.02em">Reading on safe working</h2>

      <a href="article.html" style="background: #F7EAD9; border-radius: 14px; padding: 24px; text-decoration: none; color: #0B1F33; display: flex; flex-direction: column; gap: 10px"><span style="align-self: start; background: #FFFFFF; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px">Wellbeing</span><strong style="font-size: 19px">[Saying no to duty cover without burning bridges]</strong><span style="font-size: 14px; font-weight: 600; color: #2F6B22">Set your safe booking terms in LocumDeck</span></a>
      <a href="article.html" style="background: #F7EAD9; border-radius: 14px; padding: 24px; text-decoration: none; color: #0B1F33; display: flex; flex-direction: column; gap: 10px"><span style="align-self: start; background: #FFFFFF; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px">Wellbeing</span><strong style="font-size: 19px">[Always coping? Knowing when to step back]</strong><span style="font-size: 14px; font-weight: 600; color: #2F6B22">Set your safe booking terms in LocumDeck</span></a>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 0 auto; padding: 0 24px 96px">
    <div style="background: #4FA83D; border-radius: 14px; padding: 56px 48px; display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center; justify-content: space-between">
      <h2 style="flex: 1 1 520px; margin: 0; font-weight: 800; font-size: 42px; line-height: 1.08; letter-spacing: -0.02em">Protect your working day before you accept the next one.</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center">
        <a href="#" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 18px 26px; border-radius: 6px; font-weight: 600">Set your terms in LocumDeck</a>
        <a href="join.html" style="font-weight: 700; padding: 18px 4px">New? Start 3 months free</a>
      </div>
    </div>
  </section>

  <footer style="background: #0B1F33; color: #D6DEE8; font-size: 15px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; color: #FFFFFF">nasgp</span>
      <span style="display: flex; flex-wrap: wrap; gap: 8px 24px"><a href="about.html" style="color: #D6DEE8">About</a><a href="help.html" style="color: #D6DEE8">Help</a><a href="contact.html" style="color: #D6DEE8">Contact</a><span>© 2026 NASGP</span></span>
    </div>
  </footer>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { patients: 14, len: 1, visit: 1, duty: 0 }; }
  renderVals() {
    const opts = (names, key) => names.map((n, i) => {
      const active = this.state[key] === i;
      return { name: n, active, bg: active ? '#0B1F33' : '#FFFFFF', color: active ? '#FFFFFF' : '#0B1F33', pick: () => this.setState({ [key]: i }) };
    });
    const lenNames = ['10 minutes', '12 minutes', '15 minutes'];
    const visitNames = ['None', 'Up to 1, by agreement', 'Up to 2'];
    const dutyNames = ['Not included', 'By prior agreement', 'Included'];
    const visitText = ['No home visits.', 'Up to 1 home visit, agreed in advance.', 'Up to 2 home visits within session time.'];
    const dutyText = ['Not included. Any duty cover is a separate booking.', 'Only if agreed in writing before the session.', 'Included in this session.'];
    const terms = [
      { k: 'Patients:', v: 'no more than ' + this.state.patients + ' booked per session.' },
      { k: 'Appointments:', v: 'minimum ' + lenNames[this.state.len] + ' each.' },
      { k: 'Home visits:', v: visitText[this.state.visit] },
      { k: 'Duty doctor:', v: dutyText[this.state.duty] },
      { k: 'Admin time:', v: '[30] minutes protected at the end of the session.' }
    ];
    return {
      patients: this.state.patients,
      setPatients: (e) => this.setState({ patients: Number(e.target.value) }),
      lengths: opts(lenNames, 'len'), visits: opts(visitNames, 'visit'), duty: opts(dutyNames, 'duty'),
      terms
    };
  }
}
</script>
