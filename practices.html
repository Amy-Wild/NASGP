  <!-- Why these GPs are different -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px">
    <div style="display: flex; flex-wrap: wrap; gap: 40px 72px; align-items: start">
      <div style="flex: 1 1 420px; min-width: 0">
        <h2 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em">Why these GPs are different</h2>
        <p style="margin: 18px 0 0; color: #3A4F6B; font-size: 19px">GPs on LocumDeck are self-employed professionals who built their own profile, set their own terms and chose to make themselves available directly. That is different from a doctor sent to you by an agency.</p>
        <p style="margin: 14px 0 0; color: #3A4F6B; font-size: 19px">When a GP books through LocumDeck, they have decided to work with you on terms they set — and you have seen those terms before saying yes. The engagement is direct, on both sides. That means more investment in the relationship and fewer last-minute surprises.</p>
        <p style="margin: 14px 0 0; color: #3A4F6B; font-size: 19px">Practices carry out their own checks and satisfy themselves a GP is suitable to work in their setting. LocumDeck makes that straightforward by showing credentials, GMC status, indemnity and DBS on the profile before you book.</p>
      </div>
      <div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <div style="background: #EEF6E8; border-radius: 14px; padding: 24px 28px">
          <strong style="font-size: 18px">A professional, not a commodity</strong>
          <p style="margin: 8px 0 0; color: #33475B">A GP who sets their own terms and builds their own reputation on the platform has more invested in doing a good session than one dispatched by an agency.</p>
        </div>
        <div style="background: #EEF6E8; border-radius: 14px; padding: 24px 28px">
          <strong style="font-size: 18px">Backed by 30 years of membership support</strong>
          <p style="margin: 8px 0 0; color: #33475B">NASGP members have access to guidance, CPD, chambers and support when things get complicated. GPs who are well-supported work better.</p>
        </div>
        <div style="background: #EEF6E8; border-radius: 14px; padding: 24px 28px">
          <strong style="font-size: 18px">Rebook the ones you trust</strong>

      <h2 style="flex: 1 1 320px; margin: 0; font-weight: 800; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em">Practice managers ask</h2>
      <div style="flex: 2 1 560px; min-width: 0">
        <template data-kind="for" list="{{faqs}}" as="q" hint-placeholder-count="5">
          <div style="border-top: 1px solid #DCE6D6">
            <button type="button" onClick="{{q.toggle}}" aria-expanded="{{q.open}}" style="width: 100%; background: none; border: 0; padding: 22px 0; font: inherit; font-weight: 600; font-size: 19px; color: #0B1F33; text-align: left; display: flex; justify-content: space-between; gap: 16px; cursor: pointer"><span>{{q.q}}</span><span aria-hidden="true" style="font-size: 24px; line-height: 1; color: #2F6B22">{{q.sign}}</span></button>
            <template data-kind="if" value="{{q.open}}" hint-placeholder-val="{{ false }}">
              <p style="margin: 0 0 22px; color: #3A4F6B; max-width: 680px">{{q.a}}</p>
            </template>
          </div>
        </template>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 0 24px 96px">
    <div style="background: #4FA83D; border-radius: 14px; padding: 56px 48px; display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center; justify-content: space-between">
      <h2 style="flex: 1 1 520px; margin: 0; font-weight: 800; font-size: 44px; line-height: 1.08; letter-spacing: -0.02em">Your next locum could be booked before lunch.</h2>
      <a href="join.html" style="background: #0B1F33; color: #FFFFFF; text-decoration: none; padding: 18px 26px; border-radius: 6px; font-weight: 600">Register your practice free</a>
    </div>
  </section>

  <footer style="background: #0B1F33; color: #D6DEE8; font-size: 15px">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; color: #FFFFFF">nasgp</span>
      <span style="display: flex; flex-wrap: wrap; gap: 8px 24px"><a href="about.html" style="color: #D6DEE8">About</a><a href="help.html" style="color: #D6DEE8">Help</a><a href="contact.html" style="color: #D6DEE8">Contact</a><span>© 2026 NASGP</span></span>
    </div>
  </footer>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 0 }; }
  renderVals() {
    const data = [
      { q: 'Is it really free for practices?', a: 'Yes. Practices pay the GP their agreed fee and nothing else. GPs pay NASGP a membership and booking fee.' },
      { q: 'How do we check a GP is safe to book?', a: 'Each profile shows the GP’s compliance documents, including GMC registration, DBS, indemnity and references, plus their terms and rates, before you book.' },
      { q: 'What if there is nobody available?', a: 'Request the session from your calendar. NASGP alerts local GPs and they can offer to cover it. You are notified when someone responds.' },
      { q: 'Can we pay GPs through LocumDeck?', a: 'Invoices and Locum A forms come through LocumDeck. [CONFIRM how payment itself is made and whether NASGP chases late payments.]' },
      { q: 'Can several people at the practice use it?', a: 'Yes. Add practice managers, admin staff and partners who book cover. [CONFIRM any limit.]' }
    ];
    return { faqs: data.map((f, i) => ({ q: f.q, a: f.a, open: this.state.open === i, sign: this.state.open === i ? '−' : '+', toggle: () => this.setState({ open: this.state.open === i ? -1 : i }) })) };
  }
}
</script>
